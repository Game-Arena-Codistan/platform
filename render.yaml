previews:
  generation: off

services:
  - type: web
    name: game-arena-staging
    runtime: docker
    region: singapore
    plan: starter
    dockerContext: ./infra/render-gateway
    dockerfilePath: ./infra/render-gateway/Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "10000"
      - key: WEB_HOSTPORT
        fromService:
          type: pserv
          name: game-arena-web-staging
          property: hostport
      - key: API_HOSTPORT
        fromService:
          type: pserv
          name: game-arena-api-staging
          property: hostport
      - key: ADMIN_HOSTPORT
        fromService:
          type: pserv
          name: game-arena-admin-staging
          property: hostport

  - type: pserv
    name: game-arena-web-staging
    runtime: docker
    region: singapore
    plan: starter
    dockerContext: ./apps/web
    dockerfilePath: ./apps/web/Dockerfile
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8080"
      - key: GAME_ARENA_MODE
        value: live
      - key: GAME_ARENA_API_BASE_URL
        value: /api
      - key: GAME_ARENA_GAME_ORIGIN
        value: https://game-arena-games-staging.onrender.com/games
      - key: GAME_ARENA_GAME_HOSTS
        value: game-arena-games-staging.onrender.com,games.codistan.org

  - type: pserv
    name: game-arena-api-staging
    runtime: docker
    region: singapore
    plan: starter
    dockerContext: ./apps/api
    dockerfilePath: ./apps/api/Dockerfile
    autoDeployTrigger: checksPass
    preDeployCommand: npm run migrate
    envVars:
      - key: PORT
        value: "8081"
      - key: NODE_ENV
        value: production
      - key: PUBLIC_ORIGIN
        value: https://game-arena-staging.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://game-arena-staging.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: game-arena-staging-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: REQUIRE_DATABASE
        value: "true"
      - key: OTP_PROVIDER_MODE
        value: mock
      - key: ALLOW_DEBUG_OTP
        value: "true"
      - key: JAZZCASH_MODE
        value: mock
      - key: JAZZCASH_WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_API_KEYS
        generateValue: true

  - type: pserv
    name: game-arena-admin-staging
    runtime: docker
    region: singapore
    plan: starter
    dockerContext: ./apps/admin
    dockerfilePath: ./apps/admin/Dockerfile
    autoDeployTrigger: checksPass
    envVars:
      - key: PORT
        value: "8080"
      - key: GAME_ARENA_ADMIN_API_BASE_URL
        value: /api
      - key: GAME_ARENA_ADMIN_AUTH_MODE
        value: local-key

  - type: web
    name: game-arena-games-staging
    runtime: docker
    region: singapore
    plan: starter
    dockerContext: ./apps/game-origin
    dockerfilePath: ./apps/game-origin/Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: GAME_ARENA_FRAME_ANCESTORS
        value: https://game-arena-staging.onrender.com

databases:
  - name: game-arena-staging-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: game_arena
    user: game_arena
    connectionPool: none
    ipAllowList: []
