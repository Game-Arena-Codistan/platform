name: AWS production promotion

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full commit SHA that has already passed AWS staging
        required: true
        type: string
      qualification_record:
        description: Non-sensitive link or identifier for completed staging qualification
        required: true
        type: string
      change_record:
        description: Non-sensitive approved change or go-live record
        required: true
        type: string
      confirmation:
        description: Enter PROMOTE to continue
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intentional production promotion
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          QUALIFICATION_RECORD: ${{ inputs.qualification_record }}
          CHANGE_RECORD: ${{ inputs.change_record }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = PROMOTE || { echo 'confirmation must be PROMOTE.' >&2; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          test -n "$QUALIFICATION_RECORD"
          test -n "$CHANGE_RECORD"

  provider-guard:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate expected AWS account
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo 'AWS_ACCOUNT_ID must be a twelve-digit protected environment variable.' >&2; exit 1; }
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_RUNTIME_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: game-arena-production-guard-${{ github.run_id }}
      - name: Verify administrator and support configuration
        env:
          CONFIG_PREFIX_INPUT: ${{ vars.AWS_CONFIG_PREFIX }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          [ "$account_id" = "$EXPECTED_AWS_ACCOUNT_ID" ] || { echo "Authenticated AWS account $account_id does not match AWS_ACCOUNT_ID." >&2; exit 1; }
          prefix="${CONFIG_PREFIX_INPUT:-/game-arena/production}"
          secret_arn="$(aws ssm get-parameter --name "$prefix/runtime-controls-secret-arn" --query Parameter.Value --output text)"
          runtime="$(aws secretsmanager get-secret-value --secret-id "$secret_arn" --query SecretString --output text)"
          proxy="$(jq -er '.admin_proxy_secret // ""' <<<"$runtime")"
          roles="$(jq -er '.admin_identity_roles_json // "{}"' <<<"$runtime")"
          endpoint="$(jq -er '.support_delivery_endpoint // ""' <<<"$runtime")"
          support_secret="$(jq -er '.support_delivery_secret // ""' <<<"$runtime")"
          test -n "$proxy"
          jq -e 'type == "object" and length > 0' <<<"$roles" >/dev/null
          test -n "$support_secret"
          case "$endpoint" in https://*) ;; *) echo 'Production support delivery endpoint must use HTTPS.' >&2; exit 1 ;; esac

  deploy:
    needs: [guard, provider-guard]
    uses: ./.github/workflows/aws-deploy.yml
    with:
      environment: production
      image_tag: ${{ inputs.image_tag }}
      run_migrations: true
      require_staging_evidence: true
      rollback: false
      qualification_record: ${{ inputs.qualification_record }}
      change_record: ${{ inputs.change_record }}
      deployment_reason: Approved production promotion
    secrets: inherit

  runtime-controls:
    needs: deploy
    if: needs.deploy.result == 'success'
    uses: ./.github/workflows/aws-runtime-controls.yml
    with:
      environment: production
    secrets: inherit
