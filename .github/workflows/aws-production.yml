name: AWS production promotion

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full commit SHA that has already passed AWS staging
        required: true
        type: string
      qualification_record:
        description: Non-sensitive link or identifier for completed staging qualification
        required: true
        type: string
      change_record:
        description: Non-sensitive approved change or go-live record
        required: true
        type: string
      confirmation:
        description: Enter PROMOTE to continue
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intentional production promotion
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          QUALIFICATION_RECORD: ${{ inputs.qualification_record }}
          CHANGE_RECORD: ${{ inputs.change_record }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = PROMOTE || { echo 'confirmation must be PROMOTE.' >&2; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          test -n "$QUALIFICATION_RECORD"
          test -n "$CHANGE_RECORD"

  deploy:
    needs: guard
    uses: ./.github/workflows/aws-deploy.yml
    with:
      environment: production
      image_tag: ${{ inputs.image_tag }}
      run_migrations: true
      require_staging_evidence: true
      rollback: false
      qualification_record: ${{ inputs.qualification_record }}
      change_record: ${{ inputs.change_record }}
      deployment_reason: Approved production promotion
    secrets: inherit

  runtime-controls:
    needs: deploy
    if: needs.deploy.result == 'success'
    uses: ./.github/workflows/aws-runtime-controls.yml
    with:
      environment: production
    secrets: inherit
