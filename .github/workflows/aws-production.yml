name: Managed AWS production promotion - future lane

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full commit SHA that has already passed managed AWS staging certification and human UAT
        required: true
        type: string
      qualification_record:
        description: Non-sensitive link or identifier for the READY FOR UAT staging certification
        required: true
        type: string
      uat_record:
        description: Non-sensitive human UAT approval reference for this exact SHA
        required: true
        type: string
      change_record:
        description: Non-sensitive approved production change or go-live record
        required: true
        type: string
      confirmation:
        description: Enter PROMOTE to continue
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm managed production lane is explicitly enabled
        env:
          MANAGED_PRODUCTION_ENABLED: ${{ vars.AWS_MANAGED_PRODUCTION_ENABLED }}
        run: |
          set -euo pipefail
          [ "$MANAGED_PRODUCTION_ENABLED" = true ] || {
            echo 'Managed EKS/RDS production lane is disabled. Use the staging-certified replacement cutover process only after explicit owner authorization.' >&2
            exit 1
          }
      - name: Confirm intentional production promotion
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          QUALIFICATION_RECORD: ${{ inputs.qualification_record }}
          UAT_RECORD: ${{ inputs.uat_record }}
          CHANGE_RECORD: ${{ inputs.change_record }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = PROMOTE || { echo 'confirmation must be PROMOTE.' >&2; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          test -n "$QUALIFICATION_RECORD"
          test -n "$UAT_RECORD"
          test -n "$CHANGE_RECORD"

  provider-guard:
    needs: guard
    if: needs.guard.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate expected AWS account
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo 'AWS_ACCOUNT_ID must be a twelve-digit protected environment variable.' >&2; exit 1; }
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_RUNTIME_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: game-arena-production-guard-${{ github.run_id }}
      - name: Verify administrator and support configuration
        env:
          CONFIG_PREFIX_INPUT: ${{ vars.AWS_CONFIG_PREFIX }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          [ "$account_id" = "$EXPECTED_AWS_ACCOUNT_ID" ] || { echo "Authenticated AWS account $account_id does not match AWS_ACCOUNT_ID." >&2; exit 1; }
          prefix="${CONFIG_PREFIX_INPUT:-/game-arena/production}"
          secret_arn="$(aws ssm get-parameter --name "$prefix/runtime-controls-secret-arn" --query Parameter.Value --output text)"
          runtime="$(aws secretsmanager get-secret-value --secret-id "$secret_arn" --query SecretString --output text)"
          proxy="$(jq -er '.admin_proxy_secret // ""' <<<"$runtime")"
          roles="$(jq -er '.admin_identity_roles_json // "{}"' <<<"$runtime")"
          endpoint="$(jq -er '.support_delivery_endpoint // ""' <<<"$runtime")"
          support_secret="$(jq -er '.support_delivery_secret // ""' <<<"$runtime")"
          test -n "$proxy"
          jq -e 'type == "object" and length > 0' <<<"$roles" >/dev/null
          test -n "$support_secret"
          case "$endpoint" in https://*) ;; *) echo 'Production support delivery endpoint must use HTTPS.' >&2; exit 1 ;; esac
      - name: Require READY FOR UAT certification for exact SHA
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          STAGING_PREFIX_INPUT: ${{ vars.AWS_STAGING_CONFIG_PREFIX }}
          UAT_RECORD: ${{ inputs.uat_record }}
        run: |
          set -euo pipefail
          test -n "$UAT_RECORD" || { echo 'A human UAT approval reference is required.' >&2; exit 1; }
          prefix="${STAGING_PREFIX_INPUT:-/game-arena/staging}"
          bucket="$(aws ssm get-parameter --name "$prefix/deployment-evidence-bucket" --query Parameter.Value --output text)"
          aws s3 cp "s3://$bucket/staging-certification/$IMAGE_TAG/latest.json" /tmp/staging-certification.json --only-show-errors
          jq -e --arg sha "$IMAGE_TAG" '
            .schemaVersion == "game-arena-staging-certification.v1" and
            .decision == "READY FOR UAT" and
            .expectedSha == $sha and
            (.releaseRunId | length > 0)
          ' /tmp/staging-certification.json >/dev/null

  deploy:
    needs: [guard, provider-guard]
    uses: ./.github/workflows/aws-deploy.yml
    with:
      environment: production
      image_tag: ${{ inputs.image_tag }}
      run_migrations: true
      require_staging_evidence: true
      rollback: false
      qualification_record: ${{ inputs.qualification_record }}
      change_record: ${{ inputs.change_record }}
      deployment_reason: Approved managed production promotion after staging certification and human UAT
    secrets: inherit

  runtime-controls:
    needs: deploy
    if: needs.deploy.result == 'success'
    uses: ./.github/workflows/aws-runtime-controls.yml
    with:
      environment: production
    secrets: inherit

  production-smoke:
    needs: runtime-controls
    if: needs.runtime-controls.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Authenticate for read-only production smoke
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_RUNTIME_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: game-arena-production-smoke-${{ github.run_id }}
      - name: Verify exact running public revision without mutations
        env:
          CONFIG_PREFIX_INPUT: ${{ vars.AWS_CONFIG_PREFIX }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          prefix="${CONFIG_PREFIX_INPUT:-/game-arena/production}"
          parameter() { aws ssm get-parameter --name "$prefix/$1" --query Parameter.Value --output text; }
          player="https://$(parameter public-host)"
          game="https://$(parameter game-host)"
          api="$player/api"
          curl --fail --silent --show-error --max-time 20 "$player" >/dev/null
          curl --fail --silent --show-error --max-time 20 "$api/healthz" >/dev/null
          ready="$(curl --fail --silent --show-error --max-time 20 "$api/readyz")"
          jq -e '.status == "ready"' <<<"$ready" >/dev/null
          curl --fail --silent --show-error --max-time 20 "$game/healthz" >/dev/null
          config="$(curl --fail --silent --show-error --max-time 20 "$player/config.js")"
          grep -Fq "releaseSha:\"$IMAGE_TAG\"" <<<"$config"
          headers="$(curl --fail --silent --show-error --head --max-time 20 "$player")"
          grep -qi '^x-content-type-options: *nosniff' <<<"$headers"
          grep -qi '^referrer-policy:' <<<"$headers"
          {
            echo '## Production smoke'
            echo "- Exact SHA: $IMAGE_TAG"
            echo '- Player/API/game health: passed'
            echo '- No customer, payment, wallet, game or administrative mutation was executed'
          } >> "$GITHUB_STEP_SUMMARY"
