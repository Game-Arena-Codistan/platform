name: Staging edge recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/gateway/**'
      - 'infra/host-nginx/**'
      - 'infra/docker-compose.staging.yml'
      - '.github/workflows/staging-edge-recovery.yml'

permissions:
  contents: read

concurrency:
  group: game-arena-staging-edge-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS || vars.DEPLOY_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned SSH host identity
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/game-arena-staging"
          chmod 600 "$HOME/.ssh/game-arena-staging"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Restore gateway route and public edge
        run: |
          set -euo pipefail
          tar -cf - infra/docker-compose.staging.yml infra/gateway/nginx.conf infra/host-nginx | \
            ssh -i "$HOME/.ssh/game-arena-staging" -o BatchMode=yes -o ConnectTimeout=30 "$DEPLOY_USER@$DEPLOY_HOST" \
              'set -e; cd /opt/codistan/platform; tar -xf -; test -f infra/.env; test -f infra/host-nginx/game-arena-admin.conf'
          ssh -i "$HOME/.ssh/game-arena-staging" -o BatchMode=yes -o ConnectTimeout=30 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          cd /opt/codistan/platform
          echo '=== preflight ==='
          pwd
          ls -la .deployed-sha infra/gateway/nginx.conf infra/docker-compose.staging.yml infra/.env 2>&1 || true
          if command -v ss >/dev/null 2>&1; then ss -lntp | grep -E ':(80|443|8095|18183)\s' || true; fi
          if command -v systemctl >/dev/null 2>&1; then
            echo '=== restart host nginx (public edge) ==='
            sudo -n systemctl restart nginx 2>&1 || systemctl restart nginx 2>&1 || true
            sleep 2
            sudo -n systemctl --no-pager --full status nginx 2>&1 | head -n 30 || true
          fi

          IMAGE_TAG=''
          if [ -f .deployed-sha ]; then IMAGE_TAG="$(tr -d '[:space:]' < .deployed-sha)"; fi
          if [ -z "$IMAGE_TAG" ] && [ -f infra/.env ]; then
            IMAGE_TAG="$(grep -m1 '^IMAGE_TAG=' infra/.env | cut -d= -f2- || true)"
            IMAGE_TAG="${IMAGE_TAG#\"}"; IMAGE_TAG="${IMAGE_TAG%\"}"
          fi
          IMAGE_BASE="$(grep -m1 '^IMAGE_BASE=' infra/.env 2>/dev/null | cut -d= -f2- || true)"
          IMAGE_BASE="${IMAGE_BASE#\"}"; IMAGE_BASE="${IMAGE_BASE%\"}"
          IMAGE_BASE="${IMAGE_BASE:-ghcr.io/game-arena-codistan/platform}"
          export IMAGE_BASE IMAGE_TAG
          echo "IMAGE_BASE=$IMAGE_BASE"
          echo "IMAGE_TAG=$IMAGE_TAG"

          compose=(docker compose -f infra/docker-compose.staging.yml --env-file infra/.env)
          echo '=== compose ps ==='
          "${compose[@]}" ps 2>&1 || true

          if [ -n "$IMAGE_TAG" ]; then
            echo '=== bring admin up first (required for /admin) ==='
            "${compose[@]}" up -d --no-deps --force-recreate admin 2>&1 || "${compose[@]}" up -d --no-deps admin 2>&1 || true
            for _ in $(seq 1 40); do
              if curl --fail --silent --max-time 3 http://127.0.0.1:18183/healthz >/dev/null; then
                echo 'admin direct healthz ok'
                break
              fi
              sleep 2
            done
            echo '=== ensure api/web/games/gateway are up ==='
            "${compose[@]}" up -d --remove-orphans api web game-origin gateway 2>&1 || true
            echo '=== recreate gateway after admin is reachable ==='
            "${compose[@]}" up -d --no-deps --force-recreate gateway 2>&1 || true
          else
            echo 'WARNING: IMAGE_TAG missing; skipping compose recreate' >&2
          fi

          echo '=== local health probes ==='
          gateway=0; api=0; admin=0; admin_via_gateway=0; admin_dns=0
          for _ in $(seq 1 40); do
            curl --fail --silent --max-time 3 http://127.0.0.1:8095/healthz >/dev/null && gateway=1 || gateway=0
            curl --fail --silent --max-time 3 http://127.0.0.1:8095/api/readyz >/dev/null && api=1 || api=0
            curl --fail --silent --max-time 3 http://127.0.0.1:18183/healthz >/dev/null && admin=1 || admin=0
            curl --fail --silent --max-time 3 http://127.0.0.1:8095/admin/healthz >/dev/null && admin_via_gateway=1 || admin_via_gateway=0
            if "${compose[@]}" exec -T gateway wget -q -O - http://admin:8080/healthz >/dev/null 2>&1; then admin_dns=1; else admin_dns=0; fi
            echo "probe gateway=$gateway api=$api admin=$admin admin_via_gateway=$admin_via_gateway admin_dns=$admin_dns"
            if [ "$gateway$api$admin$admin_via_gateway" = 1111 ]; then break; fi
            sleep 2
          done

          host_http="$(curl --silent --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1/healthz || true)"
          host_https="$(curl --silent --max-time 8 -k -o /dev/null -w '%{http_code}' https://127.0.0.1/healthz || true)"
          echo "host_http=$host_http host_https=$host_https"
          if command -v ss >/dev/null 2>&1; then ss -lntp | grep -E ':(80|443|8095|18183)\s' || true; fi
          "${compose[@]}" ps 2>&1 || true

          if [ "$gateway" != 1 ] || [ "$api" != 1 ]; then
            echo "CRITICAL: gateway/api not healthy (gateway=$gateway api=$api)" >&2
            "${compose[@]}" logs --tail=120 gateway api 2>&1 || true
            exit 1
          fi
          if [ "$admin" != 1 ] || [ "$admin_via_gateway" != 1 ]; then
            echo "CRITICAL: docker /admin unhealthy (admin=$admin admin_via_gateway=$admin_via_gateway admin_dns=$admin_dns)" >&2
            "${compose[@]}" logs --tail=120 admin gateway 2>&1 || true
            "${compose[@]}" exec -T gateway getent hosts admin 2>&1 || true
            exit 1
          fi

          echo '=== fix public host nginx /admin → gateway:8095 ==='
          echo '--- nginx admin mentions ---'
          sudo -n grep -RIn 'admin' /etc/nginx 2>/dev/null | head -n 80 || grep -RIn 'admin' /etc/nginx 2>/dev/null | head -n 80 || true
          sudo -n mkdir -p /etc/nginx/snippets 2>/dev/null || mkdir -p /etc/nginx/snippets 2>/dev/null || true
          if sudo -n test -d /etc/nginx/snippets 2>/dev/null; then
            sudo -n cp -f infra/host-nginx/game-arena-admin.conf /etc/nginx/snippets/game-arena-admin.conf
          elif test -d /etc/nginx/snippets; then
            cp -f infra/host-nginx/game-arena-admin.conf /etc/nginx/snippets/game-arena-admin.conf
          fi
          # Ensure the public site includes the snippet once (idempotent).
          site_files="$(sudo -n grep -Rls 'gsmarena-play.codistan.org' /etc/nginx 2>/dev/null || grep -Rls 'gsmarena-play.codistan.org' /etc/nginx 2>/dev/null || true)"
          for site in $site_files; do
            echo "patching $site"
            if ! sudo -n grep -q 'snippets/game-arena-admin.conf' "$site" 2>/dev/null && ! grep -q 'snippets/game-arena-admin.conf' "$site" 2>/dev/null; then
              tmp="$(mktemp)"
              sudo -n cat "$site" 2>/dev/null | awk '
                BEGIN{done=0}
                /server_name[[:space:]]+.*gsmarena-play\.codistan\.org/ && done==0 {
                  print
                  print "    include snippets/game-arena-admin.conf;"
                  done=1
                  next
                }
                {print}
              ' > "$tmp" || cat "$site" | awk '
                BEGIN{done=0}
                /server_name[[:space:]]+.*gsmarena-play\.codistan\.org/ && done==0 {
                  print
                  print "    include snippets/game-arena-admin.conf;"
                  done=1
                  next
                }
                {print}
              ' > "$tmp"
              sudo -n cp "$tmp" "$site" 2>/dev/null || cp "$tmp" "$site"
              rm -f "$tmp"
            fi
          done
          # Remove conflicting /admin locations that are not our snippet (best-effort).
          for site in $site_files; do
            if sudo -n grep -n 'location.*/admin' "$site" 2>/dev/null | grep -v game-arena-admin >/dev/null; then
              echo "WARNING: $site still contains other /admin locations; inspect manually if public /admin stays 502" >&2
              sudo -n grep -n 'location.*/admin' "$site" 2>/dev/null || true
            fi
          done
          if sudo -n nginx -t 2>&1 || nginx -t 2>&1; then
            sudo -n systemctl reload nginx 2>&1 || systemctl reload nginx 2>&1 || sudo -n systemctl restart nginx 2>&1 || true
          else
            echo 'WARNING: nginx -t failed after admin snippet install' >&2
          fi

          public_admin="$(curl --silent --max-time 8 -k -o /dev/null -w '%{http_code}' -H 'Host: gsmarena-play.codistan.org' https://127.0.0.1/admin/healthz || true)"
          echo "public_admin_via_host=$public_admin"
          if [ "$public_admin" != 200 ]; then
            echo "CRITICAL: public host /admin still not 200 (got $public_admin). Docker gateway is healthy; host nginx routing for /admin is wrong." >&2
            sudo -n nginx -T 2>/dev/null | grep -n 'admin' | head -n 80 || true
            exit 1
          fi
          echo 'Staging edge recovery complete (player + public /admin).'
          exit 0
          REMOTE
