name: Staging edge recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/gateway/**'
      - 'infra/docker-compose.staging.yml'
      - '.github/workflows/staging-edge-recovery.yml'

permissions:
  contents: read

concurrency:
  group: game-arena-staging-edge-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS || vars.DEPLOY_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned SSH host identity
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/game-arena-staging"
          chmod 600 "$HOME/.ssh/game-arena-staging"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Restore gateway route and public edge
        run: |
          set -euo pipefail
          tar -cf - infra/docker-compose.staging.yml infra/gateway/nginx.conf | \
            ssh -i "$HOME/.ssh/game-arena-staging" -o BatchMode=yes -o ConnectTimeout=30 "$DEPLOY_USER@$DEPLOY_HOST" \
              'set -e; cd /opt/codistan/platform; tar -xf -; test -f infra/.env'
          ssh -i "$HOME/.ssh/game-arena-staging" -o BatchMode=yes -o ConnectTimeout=30 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -uo pipefail
          cd /opt/codistan/platform
          echo '=== preflight ==='
          pwd
          ls -la .deployed-sha infra/gateway/nginx.conf infra/docker-compose.staging.yml infra/.env 2>&1 || true
          if command -v ss >/dev/null 2>&1; then ss -lntp | grep -E ':(80|443|8095|18183)\s' || true; fi
          if command -v systemctl >/dev/null 2>&1; then
            echo '=== restart host nginx (public edge) ==='
            sudo -n systemctl restart nginx 2>&1 || systemctl restart nginx 2>&1 || true
            sleep 2
            sudo -n systemctl --no-pager --full status nginx 2>&1 | head -n 30 || true
          fi

          IMAGE_TAG=''
          if [ -f .deployed-sha ]; then IMAGE_TAG="$(tr -d '[:space:]' < .deployed-sha)"; fi
          if [ -z "$IMAGE_TAG" ] && [ -f infra/.env ]; then
            IMAGE_TAG="$(grep -m1 '^IMAGE_TAG=' infra/.env | cut -d= -f2- || true)"
            IMAGE_TAG="${IMAGE_TAG#\"}"; IMAGE_TAG="${IMAGE_TAG%\"}"
          fi
          IMAGE_BASE="$(grep -m1 '^IMAGE_BASE=' infra/.env 2>/dev/null | cut -d= -f2- || true)"
          IMAGE_BASE="${IMAGE_BASE#\"}"; IMAGE_BASE="${IMAGE_BASE%\"}"
          IMAGE_BASE="${IMAGE_BASE:-ghcr.io/game-arena-codistan/platform}"
          export IMAGE_BASE IMAGE_TAG
          echo "IMAGE_BASE=$IMAGE_BASE"
          echo "IMAGE_TAG=$IMAGE_TAG"

          compose=(docker compose -f infra/docker-compose.staging.yml --env-file infra/.env)
          echo '=== compose ps ==='
          "${compose[@]}" ps 2>&1 || true

          if [ -n "$IMAGE_TAG" ]; then
            echo '=== ensure api/web/gateway/admin are up ==='
            "${compose[@]}" up -d --remove-orphans api web game-origin admin gateway 2>&1 || true
            echo '=== recreate gateway with synced nginx.conf ==='
            "${compose[@]}" up -d --no-deps --force-recreate gateway 2>&1 || true
            "${compose[@]}" up -d --no-deps admin 2>&1 || true
          else
            echo 'WARNING: IMAGE_TAG missing; skipping compose recreate' >&2
          fi

          echo '=== local health probes ==='
          gateway=0; api=0; admin=0; admin_via_gateway=0
          for _ in $(seq 1 30); do
            curl --fail --silent --max-time 3 http://127.0.0.1:8095/healthz >/dev/null && gateway=1 || gateway=0
            curl --fail --silent --max-time 3 http://127.0.0.1:8095/api/readyz >/dev/null && api=1 || api=0
            curl --fail --silent --max-time 3 http://127.0.0.1:18183/healthz >/dev/null && admin=1 || admin=0
            curl --fail --silent --max-time 3 http://127.0.0.1:8095/admin/healthz >/dev/null && admin_via_gateway=1 || admin_via_gateway=0
            echo "probe gateway=$gateway api=$api admin=$admin admin_via_gateway=$admin_via_gateway"
            if [ "$gateway$api" = 11 ]; then break; fi
            sleep 2
          done

          host_http="$(curl --silent --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1/healthz || true)"
          host_https="$(curl --silent --max-time 8 -k -o /dev/null -w '%{http_code}' https://127.0.0.1/healthz || true)"
          echo "host_http=$host_http host_https=$host_https"
          if command -v ss >/dev/null 2>&1; then ss -lntp | grep -E ':(80|443|8095|18183)\s' || true; fi
          "${compose[@]}" ps 2>&1 || true

          # Player site recovery is the hard requirement. Admin via gateway is best-effort.
          if [ "$gateway" != 1 ] || [ "$api" != 1 ]; then
            echo "CRITICAL: gateway/api not healthy (gateway=$gateway api=$api)" >&2
            "${compose[@]}" logs --tail=120 gateway api 2>&1 || true
            exit 1
          fi
          if [ "$admin_via_gateway" != 1 ]; then
            echo "WARNING: /admin via gateway still unhealthy (admin=$admin admin_via_gateway=$admin_via_gateway)" >&2
            "${compose[@]}" logs --tail=80 admin gateway 2>&1 || true
          fi
          echo 'Staging edge recovery complete.'
          exit 0
          REMOTE
