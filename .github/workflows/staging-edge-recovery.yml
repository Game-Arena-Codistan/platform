name: Staging edge recovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/gateway/**'
      - 'infra/docker-compose.staging.yml'
      - '.github/workflows/staging-edge-recovery.yml'

permissions:
  contents: read

concurrency:
  group: game-arena-staging-edge-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS || vars.DEPLOY_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned SSH host identity
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/game-arena-staging"
          chmod 600 "$HOME/.ssh/game-arena-staging"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Restore gateway route and public edge
        run: |
          set -euo pipefail
          tar -cf - infra/docker-compose.staging.yml infra/gateway/nginx.conf | \
            ssh -i "$HOME/.ssh/game-arena-staging" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
              'set -e; cd /opt/codistan/platform; tar -xf -; test -f infra/.env'
          ssh -i "$HOME/.ssh/game-arena-staging" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/codistan/platform
          test -f .deployed-sha
          IMAGE_TAG="$(tr -d '[:space:]' < .deployed-sha)"
          IMAGE_BASE="$(grep -m1 '^IMAGE_BASE=' infra/.env 2>/dev/null | cut -d= -f2- || true)"
          IMAGE_BASE="${IMAGE_BASE#\"}"; IMAGE_BASE="${IMAGE_BASE%\"}"
          IMAGE_BASE="${IMAGE_BASE:-ghcr.io/game-arena-codistan/platform}"
          export IMAGE_BASE IMAGE_TAG
          echo "Recovering edge with IMAGE_BASE=$IMAGE_BASE IMAGE_TAG=$IMAGE_TAG"
          compose=(docker compose -f infra/docker-compose.staging.yml --env-file infra/.env)
          # Prefer recreate of running tagged services; fall back to bringing the stack up.
          if ! "${compose[@]}" up -d --no-deps --force-recreate admin gateway; then
            echo 'force-recreate failed; attempting full compose up' >&2
            "${compose[@]}" up -d --remove-orphans
          fi
          for _ in $(seq 1 40); do
            gateway=0; admin=0; admin_via_gateway=0; api=0
            curl --fail --silent --max-time 3 http://127.0.0.1:8095/healthz >/dev/null && gateway=1 || true
            curl --fail --silent --max-time 3 http://127.0.0.1:18183/healthz >/dev/null && admin=1 || true
            curl --fail --silent --max-time 3 http://127.0.0.1:8095/admin/healthz >/dev/null && admin_via_gateway=1 || true
            curl --fail --silent --max-time 3 http://127.0.0.1:8095/api/readyz >/dev/null && api=1 || true
            if [ "$gateway$admin$admin_via_gateway$api" = 1111 ]; then break; fi
            sleep 2
          done
          if [ "$gateway$admin$admin_via_gateway$api" != 1111 ]; then
            echo "Edge recovery failed: gateway=$gateway admin=$admin admin_via_gateway=$admin_via_gateway api=$api" >&2
            "${compose[@]}" ps
            "${compose[@]}" logs --tail=100 admin gateway || true
            exit 1
          fi
          if command -v systemctl >/dev/null 2>&1; then
            sudo -n systemctl restart nginx >/dev/null 2>&1 || systemctl restart nginx >/dev/null 2>&1 || true
            sleep 2
            sudo -n systemctl is-active --quiet nginx || systemctl is-active --quiet nginx || true
          fi
          if command -v ss >/dev/null 2>&1; then
            ss -lntp | grep -E ':(80|443|8095|18183)\s' || true
          fi
          curl --fail --silent --max-time 5 http://127.0.0.1:8095/healthz >/dev/null
          curl --fail --silent --max-time 5 http://127.0.0.1:8095/admin/healthz >/dev/null
          curl --silent --max-time 5 -o /dev/null -w 'host_http=%{http_code}\n' http://127.0.0.1/healthz || true
          curl --silent --max-time 8 -k -o /dev/null -w 'host_https=%{http_code}\n' https://127.0.0.1/healthz || true
          echo 'Staging edge recovery complete.'
          REMOTE
