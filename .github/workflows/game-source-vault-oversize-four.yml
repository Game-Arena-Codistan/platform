name: Archive four oversized pilot source snapshots to staging vault

on:
  push:
    branches: [main]
    paths:
      - infra/opentofu/aws/game-source-vault.tf
      - catalogue/sources/oversize-four-source-provenance.json
      - .github/workflows/game-source-vault-oversize-four.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: game-source-vault-oversize-four-staging
  cancel-in-progress: false

env:
  RELEASE_TAG: pilot-ingress-four-games-20260801
  PROVENANCE_FILE: catalogue/sources/oversize-four-source-provenance.json

jobs:
  archive:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.5

      - name: Resolve protected staging AWS identity inputs
        env:
          TFVARS_B64: ${{ secrets.AWS_TFVARS_JSON_B64 }}
          ROLE_ARN: ${{ secrets.AWS_INFRA_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$TFVARS_B64"
          test -n "$ROLE_ARN"
          printf '%s' "$TFVARS_B64" | base64 -d > infra/opentofu/aws/environment.auto.tfvars.json
          chmod 600 infra/opentofu/aws/environment.auto.tfvars.json
          jq -e '.environment == "staging"' infra/opentofu/aws/environment.auto.tfvars.json >/dev/null
          account_id="$(jq -r '.expected_aws_account_id // empty' infra/opentofu/aws/environment.auto.tfvars.json)"
          aws_region="$(jq -r '.aws_region // empty' infra/opentofu/aws/environment.auto.tfvars.json)"
          [[ "$account_id" =~ ^[0-9]{12}$ ]] || { echo 'Protected staging expected_aws_account_id is invalid.' >&2; exit 1; }
          [[ "$aws_region" =~ ^[a-z0-9-]+-[0-9]+$ ]] || { echo 'Protected staging aws_region is invalid.' >&2; exit 1; }
          case "$ROLE_ARN" in
            arn:aws:iam::${account_id}:role/*) ;;
            *) echo 'Protected infrastructure role ARN does not match the protected staging account.' >&2; exit 1 ;;
          esac
          echo "EXPECTED_AWS_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "AWS_REGION=$aws_region" >> "$GITHUB_ENV"

      - name: Authenticate to AWS with staging infrastructure OIDC role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
          role-session-name: game-arena-source-vault-${{ github.run_id }}

      - name: Prepare protected staging OpenTofu configuration
        env:
          STATE_BUCKET: ${{ vars.AWS_TF_STATE_BUCKET }}
          STATE_KMS_KEY_ID: ${{ vars.AWS_TF_STATE_KMS_KEY_ID }}
          ROLE_ARN: ${{ secrets.AWS_INFRA_ROLE_ARN }}
        run: |
          set -euo pipefail
          test -n "$STATE_BUCKET"
          test -n "$ROLE_ARN"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "$account_id" = "$EXPECTED_AWS_ACCOUNT_ID"
          case "$ROLE_ARN" in
            arn:aws:iam::${account_id}:role/*) ;;
            *) echo 'Authenticated AWS account does not match the protected infrastructure role ARN.' >&2; exit 1 ;;
          esac
          jq -e --arg account "$account_id" --arg region "$AWS_REGION" '.environment == "staging" and .expected_aws_account_id == $account and .aws_region == $region' infra/opentofu/aws/environment.auto.tfvars.json >/dev/null
          if [ -n "$STATE_KMS_KEY_ID" ]; then
            echo "STATE_KMS_ARGUMENT=-backend-config=kms_key_id=$STATE_KMS_KEY_ID" >> "$GITHUB_ENV"
          fi

      - name: Initialize encrypted staging state
        working-directory: infra/opentofu/aws
        env:
          STATE_BUCKET: ${{ vars.AWS_TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          tofu init -input=false -upgrade=false -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=game-arena/staging/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            ${STATE_KMS_ARGUMENT:-}

      - name: Create source-vault-only execution plan
        working-directory: infra/opentofu/aws
        run: |
          set -euo pipefail
          tofu plan -input=false -lock-timeout=10m -out=source-vault.tfplan \
            -target=aws_s3_bucket.game_sources \
            -target=aws_s3_bucket_versioning.game_sources \
            -target=aws_s3_bucket_server_side_encryption_configuration.game_sources \
            -target=aws_s3_bucket_public_access_block.game_sources \
            -target=aws_s3_bucket_lifecycle_configuration.game_sources \
            -target=aws_ssm_parameter.game_source_vault_bucket
          tofu show -json source-vault.tfplan > source-vault.tfplan.json
          tofu show -no-color source-vault.tfplan > source-vault.tfplan.txt

      - name: Reject unrelated or destructive infrastructure changes
        run: |
          set -euo pipefail
          PLAN=infra/opentofu/aws/source-vault.tfplan.json node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const plan=JSON.parse(await readFile(process.env.PLAN,'utf8'));
          const allowed=new Set([
            'aws_s3_bucket.game_sources',
            'aws_s3_bucket_versioning.game_sources',
            'aws_s3_bucket_server_side_encryption_configuration.game_sources',
            'aws_s3_bucket_public_access_block.game_sources',
            'aws_s3_bucket_lifecycle_configuration.game_sources',
            'aws_ssm_parameter.game_source_vault_bucket'
          ]);
          const changed=(plan.resource_changes||[]).filter(item=>!(item.change?.actions||[]).every(action=>action==='no-op'||action==='read'));
          const unexpected=changed.filter(item=>!allowed.has(item.address));
          const destructive=changed.filter(item=>(item.change?.actions||[]).includes('delete'));
          if(unexpected.length) throw new Error(`Targeted source-vault plan contains unrelated changes: ${unexpected.map(x=>x.address).join(', ')}`);
          if(destructive.length) throw new Error(`Source-vault plan contains destructive changes: ${destructive.map(x=>x.address).join(', ')}`);
          console.log(JSON.stringify({decision:'SAFE_TO_APPLY',changed:changed.map(x=>({address:x.address,actions:x.change.actions}))}));
          NODE

      - name: Upload targeted plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-vault-plan-${{ github.run_id }}
          path: infra/opentofu/aws/source-vault.tfplan.txt
          retention-days: 30

      - name: Apply only the reviewed source-vault plan
        working-directory: infra/opentofu/aws
        run: tofu apply -input=false -auto-approve source-vault.tfplan

      - name: Verify private versioned KMS source vault
        working-directory: infra/opentofu/aws
        run: |
          set -euo pipefail
          bucket="$(tofu output -raw game_source_vault_bucket)"
          test -n "$bucket"
          test "$(aws s3api get-bucket-versioning --bucket "$bucket" --query Status --output text)" = Enabled
          test "$(aws s3api get-bucket-encryption --bucket "$bucket" --query 'ServerSideEncryptionConfiguration.Rules[0].ApplyServerSideEncryptionByDefault.SSEAlgorithm' --output text)" = aws:kms
          block="$(aws s3api get-public-access-block --bucket "$bucket" --query 'PublicAccessBlockConfiguration.[BlockPublicAcls,IgnorePublicAcls,BlockPublicPolicy,RestrictPublicBuckets]' --output text)"
          test "$(echo "$block" | tr '\t' ' ')" = 'True True True True'
          echo "SOURCE_VAULT_BUCKET=$bucket" >> "$GITHUB_ENV"

      - name: Validate private draft release and archive all eight source snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f "$PROVENANCE_FILE"
          jq -e '.schemaVersion == 1 and .releaseTag == "pilot-ingress-four-games-20260801" and .productionActivation == false and ([.games[].sources[]] | length) == 8' "$PROVENANCE_FILE" >/dev/null

          release="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -c --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)]')"
          test "$(jq 'length' <<<"$release")" = 1
          release="$(jq -c '.[0]' <<<"$release")"
          test "$(jq -r '.draft' <<<"$release")" = true

          mkdir -p "$RUNNER_TEMP/source-vault-downloads"
          : > "$RUNNER_TEMP/source-vault-evidence.jsonl"

          while IFS= read -r source; do
            slug="$(jq -r '.slug' <<<"$source")"
            variant="$(jq -r '.variant' <<<"$source")"
            name="$(jq -r '.assetName' <<<"$source")"
            bytes="$(jq -r '.bytes' <<<"$source")"
            sha="$(jq -r '.sha256' <<<"$source")"
            key="$(jq -r '.vaultKey' <<<"$source")"
            asset="$(jq -c --arg name "$name" '[.assets[] | select(.name == $name)]' <<<"$release")"
            test "$(jq 'length' <<<"$asset")" = 1
            asset="$(jq -c '.[0]' <<<"$asset")"
            test "$(jq -r '.size' <<<"$asset")" = "$bytes"
            test "$(jq -r '.digest' <<<"$asset")" = "sha256:$sha"
            asset_id="$(jq -r '.id' <<<"$asset")"
            local_file="$RUNNER_TEMP/source-vault-downloads/$name"
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$local_file"
            test "$(stat -c %s "$local_file")" = "$bytes"
            test "$(sha256sum "$local_file" | awk '{print $1}')" = "$sha"
            expected_b64="$(printf '%s' "$sha" | xxd -r -p | base64 -w0)"

            if aws s3api head-object --bucket "$SOURCE_VAULT_BUCKET" --key "$key" --checksum-mode ENABLED > "$RUNNER_TEMP/source-head.json" 2>/dev/null; then
              echo "Verifying existing source object: $slug/$variant"
            else
              aws s3 cp "$local_file" "s3://$SOURCE_VAULT_BUCKET/$key" \
                --only-show-errors \
                --sse aws:kms \
                --checksum-algorithm SHA256 \
                --metadata "source-sha256=$sha,source-release=$RELEASE_TAG,source-variant=$variant"
              aws s3api head-object --bucket "$SOURCE_VAULT_BUCKET" --key "$key" --checksum-mode ENABLED > "$RUNNER_TEMP/source-head.json"
            fi

            head_json="$(cat "$RUNNER_TEMP/source-head.json")"
            test "$(jq -r '.ContentLength' <<<"$head_json")" = "$bytes"
            test "$(jq -r '.ServerSideEncryption' <<<"$head_json")" = 'aws:kms'
            test "$(jq -r '.ChecksumSHA256' <<<"$head_json")" = "$expected_b64"
            test "$(jq -r '.Metadata["source-sha256"]' <<<"$head_json")" = "$sha"
            test "$(jq -r '.Metadata["source-release"]' <<<"$head_json")" = "$RELEASE_TAG"
            version_id="$(jq -r '.VersionId' <<<"$head_json")"
            test -n "$version_id" && test "$version_id" != null
            jq -n --arg slug "$slug" --arg variant "$variant" --arg assetName "$name" --arg key "$key" --arg sha256 "$sha" --arg versionId "$version_id" --argjson bytes "$bytes" \
              '{slug:$slug,variant:$variant,assetName:$assetName,bytes:$bytes,sha256:$sha256,vaultKey:$key,versionId:$versionId,remoteChecksumVerified:true,sse:"aws:kms"}' \
              >> "$RUNNER_TEMP/source-vault-evidence.jsonl"
            rm -f "$local_file"
          done < <(jq -c '.games[] as $game | $game.sources[] | . + {slug:$game.slug}' "$PROVENANCE_FILE")

          jq -s --arg releaseTag "$RELEASE_TAG" --arg vaultBucket "$SOURCE_VAULT_BUCKET" \
            '{schemaVersion:1,decision:(if length==8 then "READY" else "NOT_READY" end),releaseTag:$releaseTag,vaultBucket:$vaultBucket,objects:.,objectsVerified:length,productionActivation:false}' \
            "$RUNNER_TEMP/source-vault-evidence.jsonl" > "$RUNNER_TEMP/source-vault-evidence.json"
          jq -e '.decision == "READY" and .objectsVerified == 8 and ([.objects[] | select(.remoteChecksumVerified != true)] | length) == 0' "$RUNNER_TEMP/source-vault-evidence.json" >/dev/null
          rm -rf "$RUNNER_TEMP/source-vault-downloads"
          cat "$RUNNER_TEMP/source-vault-evidence.json"

      - name: Upload source-vault verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oversized-source-vault-${{ github.run_id }}
          path: ${{ runner.temp }}/source-vault-evidence.json
          retention-days: 90
          if-no-files-found: error

      - name: Completion summary
        run: |
          {
            echo '## Oversized pilot source-vault archival'
            echo
            echo '- Source snapshots: 8/8 locally SHA-256 verified against the private draft Release.'
            echo '- Remote source-vault objects: 8/8 S3 SHA-256 checksums verified.'
            echo '- Vault controls: private, versioned, KMS encrypted.'
            echo '- Draft Release remains private.'
            echo '- Production activation: false; production untouched.'
          } >> "$GITHUB_STEP_SUMMARY"
