name: Import and publish game content

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Import a single ZIP or read approved rich links from the submission sheet
        required: true
        type: choice
        options: [single, spreadsheet]
      environment:
        description: Protected artifact environment
        required: true
        type: choice
        options: [staging, production]
      zip_url:
        description: HTTPS/Google Drive ZIP URL for single mode
        required: false
        type: string
      manifest_json:
        description: Single-mode manifest JSON; version may be auto
        required: false
        type: string
      spreadsheet_id:
        description: Google spreadsheet ID for spreadsheet mode
        required: false
        type: string
      sheet_name:
        description: Visible sheet tab for spreadsheet mode
        required: false
        type: string
      slug:
        description: Optional game slug filter for spreadsheet mode
        required: false
        type: string
      limit:
        description: Maximum rows to process
        required: false
        default: '1'
        type: string
      publish:
        description: Publish reviewed immutable artifacts to the selected AWS environment
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: game-content-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: [self-hosted, linux, x64, game-arena-ci]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify dedicated runner
        run: bash scripts/check-self-hosted-runner.sh
      - name: Prepare isolated artifact workspace
        run: mkdir -p /tmp/game-arena-artifacts apps/game-ops/reports catalogue/releases
      - name: Import one remote build
        if: inputs.mode == 'single'
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          MANIFEST_JSON: ${{ inputs.manifest_json }}
          GAME_ARENA_ACTOR: github-actions:${{ github.actor }}
        run: |
          set -euo pipefail
          test -n "$ZIP_URL" && test -n "$MANIFEST_JSON"
          node apps/game-ops/src/import-remote.mjs \
            --zip-url "$ZIP_URL" \
            --manifest-json "$MANIFEST_JSON" \
            --output-root /tmp/game-arena-artifacts \
            --audit-root apps/game-ops/reports/audit | tee apps/game-ops/reports/single-import.json
      - name: Import approved sheet builds
        if: inputs.mode == 'spreadsheet'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
          SPREADSHEET_ID: ${{ inputs.spreadsheet_id }}
          SHEET_NAME: ${{ inputs.sheet_name }}
          SLUG: ${{ inputs.slug }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" && test -n "$SPREADSHEET_ID" && test -n "$SHEET_NAME"
          args=(--spreadsheet-id "$SPREADSHEET_ID" --sheet-name "$SHEET_NAME" --limit "$LIMIT" --output-root /tmp/game-arena-artifacts --artwork-root /tmp/game-arena-artifacts/artwork --audit-root apps/game-ops/reports/audit --report apps/game-ops/reports/catalogue-import.json)
          if [ -n "$SLUG" ]; then args+=(--slug "$SLUG"); fi
          node apps/game-ops/src/import-catalogue.mjs "${args[@]}"
      - name: Validate generated artifacts
        run: |
          set -euo pipefail
          cd apps/game-ops && npm run ci
          cd ../web && npm ci --ignore-scripts --no-audit --no-fund && npm run ci
          cd ../api && npm ci --ignore-scripts --no-audit --no-fund && npm run ci
          test -d /tmp/game-arena-artifacts/games
          find /tmp/game-arena-artifacts/games -name game-manifest.json -print -quit | grep -q .
      - name: Create review metadata
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            slug="$(jq -er .slug "$manifest")"; version="$(jq -er .version "$manifest")"
            mkdir -p "catalogue/releases/$slug"
            jq '{schemaVersion,slug,title,version,entrypoint,buildSha256,totalBytes,fileCount,permissions,bridgeVersion,minDeviceTier,rolloutPercentage,publishedAt,publishedBy,scan}' "$manifest" > "catalogue/releases/$slug/$version.json"
          done < <(find /tmp/game-arena-artifacts/games -name game-manifest.json -type f | sort)
          find catalogue/releases -type f -name '*.json' -print | sort > apps/game-ops/reports/release-metadata.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reviewed-game-artifacts-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            /tmp/game-arena-artifacts
            apps/game-ops/reports
            catalogue/releases
          retention-days: 7
          if-no-files-found: error
      - name: Validate expected AWS account
        if: inputs.publish
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo 'AWS_ACCOUNT_ID must be a twelve-digit protected environment variable.' >&2; exit 1; }
      - name: Authenticate to AWS for protected publication
        if: inputs.publish
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_GAME_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: game-arena-content-${{ github.run_id }}
      - name: Publish immutable game versions
        if: inputs.publish
        env:
          CONFIG_PREFIX_INPUT: ${{ vars.AWS_CONFIG_PREFIX }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          [ "$account_id" = "$EXPECTED_AWS_ACCOUNT_ID" ] || { echo "Authenticated AWS account $account_id does not match AWS_ACCOUNT_ID." >&2; exit 1; }
          prefix="${CONFIG_PREFIX_INPUT:-/game-arena/${{ inputs.environment }}}"
          bucket="$(aws ssm get-parameter --name "$prefix/game-artifact-bucket" --query Parameter.Value --output text)"
          while IFS= read -r manifest; do
            slug="$(jq -er .slug "$manifest")"; version="$(jq -er .version "$manifest")"
            source="$(dirname "$manifest")"
            destination="s3://$bucket/games/$slug/$version/"
            aws s3api head-object --bucket "$bucket" --key "games/$slug/$version/game-manifest.json" >/dev/null 2>&1 && { echo "Immutable version already exists: $slug@$version" >&2; exit 1; }
            aws s3 sync "$source/" "$destination" --only-show-errors --cache-control 'public,max-age=31536000,immutable' --sse aws:kms
          done < <(find /tmp/game-arena-artifacts/games -name game-manifest.json -type f | sort)
      - name: Open metadata review pull request
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="content/game-metadata-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name game-arena-content-bot
          git config user.email game-arena-content-bot@users.noreply.github.com
          git add catalogue/releases apps/game-ops/reports
          git diff --cached --quiet && { echo 'No release metadata was generated.' >&2; exit 1; }
          git commit -m 'Games: record reviewed immutable releases'
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title 'Games: review immutable release metadata' --body $'Artifacts were published through the protected AWS content role.\n\nThis PR contains only manifests, digests and non-sensitive audit evidence; no game binaries or source archives are committed to the platform repository.'
      - name: Clean self-hosted runner
        if: always()
        run: bash scripts/cleanup-self-hosted-runner.sh
