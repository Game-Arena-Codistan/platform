name: One-shot launch patches v2

on:
  push:
    branches: [agent/complete-launch-blockers]
    paths: [.github/launch-patch-trigger]

permissions:
  contents: write

concurrency:
  group: one-shot-launch-patches
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-launch-blockers
          fetch-depth: 0
      - name: Apply asserted source patches
        run: |
          set -euo pipefail
          python scripts/apply-large-launch-patches.py
          rm -f \
            .github/launch-patch-trigger \
            .github/workflows/one-shot-launch-patches.yml \
            .github/workflows/one-shot-launch-patches-v2.yml \
            scripts/apply-large-launch-patches.py
          git diff --check
      - name: Commit generated changes
        run: |
          set -euo pipefail
          git config user.name game-arena-release-bot
          git config user.email game-arena-release-bot@users.noreply.github.com
          git add -A
          git commit -m 'Deploy: apply final launch security controls'
          git push origin HEAD:agent/complete-launch-blockers
