name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Install and validate packages
        run: |
          cd apps/api && npm ci --ignore-scripts --no-audit --no-fund && npm run check
          cd ../web && npm ci --ignore-scripts --no-audit --no-fund && npm run check
          cd ../game-ops && npm run check
          cd ../../packages/game-bridge && npm run ci
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:javascript-typescript
          output: codeql-results
          upload: never
      - name: Retain CodeQL SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          retention-days: 30
          if-no-files-found: error
