name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Install and validate packages
        run: |
          cd apps/api && npm ci --ignore-scripts --no-audit --no-fund && npm run check
          cd ../web && npm ci --ignore-scripts --no-audit --no-fund && npm run check
          cd ../game-ops && npm run check
          cd ../../packages/game-bridge && npm run ci
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
          output: codeql-results
          upload: never
      - name: Retain CodeQL SARIF
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          retention-days: 30
          if-no-files-found: error
