name: Publish 60-game bundle to local staging server

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/game-content-local-staging.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft GitHub release containing bundle-registry.json and 60 game ZIPs
        required: true
        default: portfolio-ingress-60-20260901
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: game-content-60-local-staging
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'portfolio-ingress-60-20260901' }}
      STAGING_ORIGIN: https://gsmarena-play.codistan.org
      GAME_ARENA_MAX_COMPRESSED_BYTES: '134217728'
      GAME_ARENA_MAX_EXPANDED_BYTES: '536870912'
      GAME_ARENA_MAX_ENTRIES: '10000'
      GAME_ARENA_MAX_COMPRESSION_RATIO: '250'
      GAME_ARENA_EXTRACTION_TIMEOUT_MS: '120000'
      GAME_ARENA_FREE_SPACE_RESERVE_BYTES: '1073741824'
      GAME_ARENA_ACTOR: github-actions:${{ github.actor }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS || vars.DEPLOY_SSH_KNOWN_HOSTS }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate local staging access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]

      - name: Prepare isolated bundle workspace
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "game-arena-local-$env:GITHUB_RUN_ID"
          $registry = Join-Path $root 'registry'
          $ingress = Join-Path $root 'ingress'
          $artifacts = Join-Path $root 'artifacts'
          $audit = Join-Path $root 'audit'
          $local = Join-Path $root 'local'
          New-Item -ItemType Directory -Force -Path $root, $registry, $ingress, $artifacts, $audit, $local, 'apps/game-ops/reports', 'catalogue/releases' | Out-Null
          "BUNDLE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUNDLE_REGISTRY=$(Join-Path $registry 'bundle-registry.json')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download and validate private bundle registry
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'GameArenaLocalStagingImporter/1.0'
          }
          $release = $null
          for ($page = 1; $page -le 10 -and $null -eq $release; $page++) {
            $pageReleases = @(Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases?per_page=100&page=$page" -Headers $headers)
            $release = @($pageReleases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG }) | Select-Object -First 1
            if ($pageReleases.Count -lt 100) { break }
          }
          if ($null -eq $release) { throw "Draft release not found: $env:RELEASE_TAG" }
          if (-not $release.draft) { throw 'Bundle ingress release must remain draft/private.' }
          $registryAssets = @($release.assets | Where-Object { $_.name -eq 'bundle-registry.json' })
          if ($registryAssets.Count -ne 1) { throw "Expected exactly one bundle-registry.json asset; found $($registryAssets.Count)." }
          $downloadHeaders = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/octet-stream'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'GameArenaLocalStagingImporter/1.0'
          }
          Invoke-WebRequest -Uri $registryAssets[0].url -Headers $downloadHeaders -OutFile $env:BUNDLE_REGISTRY -UseBasicParsing
          $registry = Get-Content -LiteralPath $env:BUNDLE_REGISTRY -Raw | ConvertFrom-Json
          if ($registry.schemaVersion -ne 1) { throw 'Bundle registry schemaVersion must be 1.' }
          if ($registry.productionActivation -ne $false) { throw 'Bundle registry must disable production activation.' }
          $games = @($registry.games)
          if ($games.Count -ne 60) { throw "Bundle registry must contain exactly 60 games; found $($games.Count)." }
          $slugs = @{}
          foreach ($game in $games) {
            $slug = [string]$game.slug
            if ($slug -notmatch '^[a-z0-9][a-z0-9-]{1,63}$') { throw "Invalid slug: $slug" }
            if ($slugs.ContainsKey($slug)) { throw "Duplicate slug: $slug" }
            $slugs[$slug] = $true
            if ([string]$game.assetName -notmatch '^[a-z0-9][a-z0-9-]{1,63}\.zip$') { throw "Unsafe asset name: $($game.assetName)" }
            if ([string]$game.sha256 -notmatch '^[a-f0-9]{64}$') { throw "Invalid SHA-256: $slug" }
            if ([int64]$game.compressedBytes -le 0 -or [int64]$game.compressedBytes -gt 134217728) { throw "Invalid compressed size: $slug" }
            if ($game.manifest.rolloutPercentage -ne 0) { throw "Ingress rollout must remain 0: $slug" }
          }
          Write-Host "Validated private 60-game registry: $env:RELEASE_TAG"

      - name: Download and verify all 60 release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & node apps/game-ops/src/download-pilot-release.mjs `
            --tag "$env:RELEASE_TAG" `
            --registry "$env:BUNDLE_REGISTRY" `
            --output (Join-Path $env:BUNDLE_ROOT 'ingress') 2>&1
          if ($LASTEXITCODE -ne 0) { $output | Write-Host; throw 'Bundle asset download or digest verification failed.' }
          $output | Tee-Object -FilePath 'apps/game-ops/reports/bundle-download.json'

      - name: Preflight, scan and package all 60 builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & node apps/game-ops/src/import-pilot-release.mjs `
            --registry "$env:BUNDLE_REGISTRY" `
            --ingress (Join-Path $env:BUNDLE_ROOT 'ingress') `
            --output (Join-Path $env:BUNDLE_ROOT 'artifacts') `
            --audit (Join-Path $env:BUNDLE_ROOT 'audit') `
            --report 'apps/game-ops/reports/portfolio-bundle-import.json' 2>&1
          if ($LASTEXITCODE -ne 0) { $output | Write-Host; throw 'Bundle preflight, scan or packaging failed.' }
          $output | Write-Host

      - name: Validate game operations package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location apps/game-ops
          try {
            & npm run ci
            if ($LASTEXITCODE -ne 0) { throw 'Game operations validation failed.' }
          } finally { Pop-Location }

      - name: Prepare local-server catalogue and immutable install package
        shell: bash
        run: |
          set -euo pipefail
          node tools/game-content/prepare-local-staging-bundle.mjs \
            --games-root "$BUNDLE_ROOT/artifacts/games" \
            --output "$BUNDLE_ROOT/local" \
            --catalogue-root catalogue/releases \
            --release-tag "$RELEASE_TAG"
          test "$(find "$BUNDLE_ROOT/artifacts/games" -name game-manifest.json -type f | wc -l | tr -d ' ')" = 60
          test "$(wc -l < "$BUNDLE_ROOT/local/certification.tsv" | tr -d ' ')" = 60

      - name: Prepare pinned SSH host identity
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/game-arena-staging"
          chmod 600 "$HOME/.ssh/game-arena-staging"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Sync local-content staging configuration
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/game-arena-staging" -o BatchMode=yes \
            infra/docker-compose.staging.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/codistan/platform/infra/docker-compose.staging.yml"

      - name: Transfer scanner-approved game package to staging server
        shell: bash
        run: |
          set -euo pipefail
          stage="/opt/codistan/platform/.game-content-stage-$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/game-arena-staging" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; rm -rf '$stage'; mkdir -p '$stage/games' '$stage/control' '$stage/baseline'"
          tar -C "$BUNDLE_ROOT/artifacts/games" -czf - . | \
            ssh -i "$HOME/.ssh/game-arena-staging" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
              "tar -xzf - -C '$stage/games'"
          tar -C apps/game-origin/public/games -czf - arena-dash | \
            ssh -i "$HOME/.ssh/game-arena-staging" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
              "tar -xzf - -C '$stage/baseline'"
          scp -i "$HOME/.ssh/game-arena-staging" -o BatchMode=yes \
            "$BUNDLE_ROOT/local/runtime-review.sql" \
            "$BUNDLE_ROOT/local/runtime-live.sql" \
            "$BUNDLE_ROOT/local/certification.tsv" \
            "$DEPLOY_USER@$DEPLOY_HOST:$stage/control/"

      - name: Install immutable files, wire game origin, and stage catalogue at rollout zero
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/game-arena-staging" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/codistan/platform
          stage=".game-content-stage-$RUN_ID"
          final="game-content/games"
          mkdir -p "$final"
          shopt -s nullglob
          manifests=("$stage"/games/*/*/game-manifest.json)
          [ "${#manifests[@]}" -eq 60 ] || { echo "Expected 60 staged manifests; found ${#manifests[@]}" >&2; exit 1; }
          installed=0
          resumed=0
          for manifest in "${manifests[@]}"; do
            source_dir="$(dirname "$manifest")"
            version="$(basename "$source_dir")"
            slug="$(basename "$(dirname "$source_dir")")"
            hash="$(tr -d '\r\n' < "$source_dir/.game-arena-build-sha256")"
            entry="$(tr -d '\r\n' < "$source_dir/.game-arena-entrypoint")"
            target="$final/$slug/$version"
            if [ -e "$target" ]; then
              [ -f "$target/.game-arena-build-sha256" ] || { echo "Refusing unverifiable immutable collision: $slug@$version" >&2; exit 1; }
              existing="$(tr -d '\r\n' < "$target/.game-arena-build-sha256")"
              [ "$existing" = "$hash" ] || { echo "Immutable version collision: $slug@$version" >&2; exit 1; }
              [ -f "$target/$entry" ] || { echo "Existing immutable entrypoint missing: $slug@$version/$entry" >&2; exit 1; }
              resumed=$((resumed+1))
            else
              mkdir -p "$final/$slug"
              mv "$source_dir" "$target"
              installed=$((installed+1))
            fi
          done

          if [ ! -f "$final/arena-dash/index.html" ]; then
            mkdir -p "$final/arena-dash"
            cp "$stage/baseline/arena-dash/index.html" "$final/arena-dash/index.html"
          fi
          chmod -R a+rX game-content/games

          IMAGE_BASE='ghcr.io/game-arena-codistan/platform'
          IMAGE_TAG="$(cat .deployed-sha)"
          export IMAGE_BASE IMAGE_TAG
          compose=(docker compose -f infra/docker-compose.staging.yml --env-file infra/.env)
          "${compose[@]}" config >/tmp/game-arena-local-content-compose.yml
          "${compose[@]}" up -d --no-deps --force-recreate game-origin
          healthy=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8082/healthz >/dev/null; then healthy=1; break; fi
            sleep 2
          done
          [ "$healthy" = 1 ] || { echo 'Local game-origin failed readiness.' >&2; exit 1; }

          checked=0
          while IFS=$'\t' read -r slug version entry hash; do
            [ -n "$slug" ] || continue
            test -f "$final/$slug/$version/$entry"
            curl --fail --silent --show-error "http://127.0.0.1:8082/games/$slug/$version/$entry" -o /dev/null
            checked=$((checked+1))
          done < "$stage/control/certification.tsv"
          [ "$checked" -eq 60 ] || { echo "Expected 60 local origin checks; found $checked" >&2; exit 1; }
          curl --fail --silent --show-error http://127.0.0.1:8082/games/arena-dash/index.html -o /dev/null

          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U game_arena -d game_arena < "$stage/control/runtime-review.sql"
          printf 'installed=%s resumed=%s origin_checked=%s baseline_preserved=arena-dash\n' "$installed" "$resumed" "$checked"
          REMOTE

      - name: Merge generated local-staging release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="content/local-staging-metadata-$GITHUB_RUN_ID"
          git config user.name 'game-arena-content-bot'
          git config user.email 'game-arena-content-bot@users.noreply.github.com'
          git switch -c "$branch"
          git add catalogue/releases apps/game-ops/reports
          if git diff --cached --quiet; then
            echo 'Release metadata is already present on main; no metadata PR required.'
          else
            git commit -m 'Games: record 60-game local staging bundle'
            git push --set-upstream origin "$branch"
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title 'Games: record 60-game local staging bundle' \
              --body 'Records the scanner-approved 60-game bundle served from the controlled local staging server. Release metadata remains rollout 0%; runtime activation occurs only after all controlled-origin checks pass. Tracks #74 and #79.')"
            gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
            echo "Merged metadata PR: $pr_url"
          fi

      - name: Activate all 60 records on local staging
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/game-arena-staging" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/codistan/platform
          stage=".game-content-stage-$RUN_ID"
          IMAGE_BASE='ghcr.io/game-arena-codistan/platform'
          IMAGE_TAG="$(cat .deployed-sha)"
          export IMAGE_BASE IMAGE_TAG
          compose=(docker compose -f infra/docker-compose.staging.yml --env-file infra/.env)
          "${compose[@]}" exec -T postgres psql -v ON_ERROR_STOP=1 -U game_arena -d game_arena < "$stage/control/runtime-live.sql"
          "${compose[@]}" restart api
          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8095/api/readyz >/dev/null; then ready=1; break; fi
            sleep 2
          done
          [ "$ready" = 1 ] || { echo 'API did not become ready after 60-game activation.' >&2; exit 1; }
          REMOTE

      - name: Certify all 60 controlled-origin launch URLs and catalogue visibility
        shell: bash
        run: |
          set -euo pipefail
          CERT_FILE="$BUNDLE_ROOT/local/certification.json" STAGING_ORIGIN="$STAGING_ORIGIN" node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const cert=JSON.parse(await readFile(process.env.CERT_FILE,'utf8'));
          if(cert.games.length!==60) throw new Error(`Expected 60 certification records; found ${cert.games.length}`);
          const origin=process.env.STAGING_ORIGIN.replace(/\/$/,'');
          const catalogueResponse=await fetch(`${origin}/api/v1/catalog/games`);
          if(!catalogueResponse.ok) throw new Error(`Catalogue request failed: ${catalogueResponse.status}`);
          const payload=await catalogueResponse.json();
          const byId=new Map((payload.games||[]).map(game=>[game.id,game]));
          const failures=[];
          let cursor=0;
          const workers=Array.from({length:8},async()=>{
            while(true){
              const index=cursor++;
              if(index>=cert.games.length) return;
              const expected=cert.games[index];
              const record=byId.get(expected.slug);
              if(!record){failures.push(`${expected.slug}: missing from public catalogue`);continue;}
              if(record.status!=='live'||Number(record.rolloutPercentage)!==100){failures.push(`${expected.slug}: not live at 100% rollout`);continue;}
              if(record.gameUrl!==expected.gameUrl){failures.push(`${expected.slug}: gameUrl mismatch`);continue;}
              try{
                const response=await fetch(`${origin}${expected.gameUrl}`,{redirect:'follow',signal:AbortSignal.timeout(20000)});
                if(!response.ok) failures.push(`${expected.slug}: launch returned HTTP ${response.status}`);
                else await response.body?.cancel();
              }catch(error){failures.push(`${expected.slug}: ${error.message}`);}
            }
          });
          await Promise.all(workers);
          if(failures.length) throw new Error(`60-game staging certification failed:\n${failures.join('\n')}`);
          console.log(JSON.stringify({decision:'READY',catalogueGames:payload.games.length,portfolioLive:60,launchUrlsPassed:60,origin}));
          NODE

      - name: Record local staging publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: game-portfolio-local-staging-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/game-arena-local-${{ github.run_id }}/audit
            ${{ runner.temp }}/game-arena-local-${{ github.run_id }}/local
            apps/game-ops/reports
            catalogue/releases
          retention-days: 30
          if-no-files-found: warn

      - name: Local staging completion summary
        if: success()
        shell: bash
        run: |
          {
            echo '## 60-game local staging publication'
            echo
            echo '- Storage: local staging server filesystem; no AWS or S3 publication.'
            echo '- Immutable path: `/opt/codistan/platform/game-content/games/<slug>/<version>/`.'
            echo '- Controlled game origin: `/games/<slug>/<version>/<entrypoint>`.'
            echo '- Scanner/preflight: 60/60 passed.'
            echo '- Catalogue: 60/60 live at 100% staging rollout.'
            echo '- Launch URL certification: 60/60 passed.'
            echo '- Existing bundled `arena-dash` demo remains reachable after the local content mount.'
            echo '- Rewards and competitions remain disabled for this imported portfolio.'
          } >> "$GITHUB_STEP_SUMMARY"
