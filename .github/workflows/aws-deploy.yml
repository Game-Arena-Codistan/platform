name: AWS reusable deployment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      run_migrations:
        required: false
        type: boolean
        default: true
      require_staging_evidence:
        required: false
        type: boolean
        default: false
      rollback:
        required: false
        type: boolean
        default: false
      qualification_record:
        required: false
        type: string
        default: ''
      change_record:
        required: false
        type: string
        default: ''
      deployment_reason:
        required: false
        type: string
        default: GitHub deployment
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Environment
        required: true
        type: choice
        options: [staging, production]
      image_tag:
        description: Full commit SHA to deploy
        required: true
        type: string
      run_migrations:
        description: Run backwards-compatible migrations
        required: true
        type: boolean
        default: true
      require_staging_evidence:
        description: Require an AWS staging deployment marker
        required: true
        type: boolean
        default: false
      rollback:
        description: This is a rollback deployment
        required: true
        type: boolean
        default: false
      qualification_record:
        description: Non-sensitive staging qualification record
        required: false
        type: string
      change_record:
        description: Non-sensitive change or incident record
        required: false
        type: string
      deployment_reason:
        description: Deployment reason
        required: false
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: aws-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.image_tag }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Validate immutable release and AWS target
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG_INPUT" =~ ^[0-9a-f]{40}$ ]] || { echo 'image_tag must be a full 40-character commit SHA.' >&2; exit 1; }
          [[ "$EXPECTED_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || { echo 'AWS_ACCOUNT_ID must be a twelve-digit protected environment variable.' >&2; exit 1; }
          git fetch origin main --prune
          git merge-base --is-ancestor "$IMAGE_TAG_INPUT" origin/main || { echo 'Selected SHA is not reachable from main.' >&2; exit 1; }

      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: game-arena-deploy-${{ github.run_id }}

      - name: Resolve AWS environment configuration
        env:
          CONFIG_PREFIX_INPUT: ${{ vars.AWS_CONFIG_PREFIX }}
          ENVIRONMENT_INPUT: ${{ inputs.environment }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          OTP_MODE_INPUT: ${{ vars.OTP_PROVIDER_MODE }}
          JAZZCASH_MODE_INPUT: ${{ vars.JAZZCASH_MODE }}
          ALLOW_DEBUG_OTP_INPUT: ${{ vars.ALLOW_DEBUG_OTP }}
        run: |
          set -euo pipefail
          prefix="${CONFIG_PREFIX_INPUT:-/game-arena/${ENVIRONMENT_INPUT}}"
          parameter() { aws ssm get-parameter --name "$prefix/$1" --query 'Parameter.Value' --output text; }

          cluster_name="$(parameter eks-cluster-name)"
          lbc_role_arn="$(parameter aws-load-balancer-controller-role)"
          lbc_chart_version="$(parameter aws-load-balancer-controller-chart)"
          db_endpoint="$(parameter rds-endpoint)"
          db_port="$(parameter rds-port)"
          db_name="$(parameter rds-database)"
          db_secret_arn="$(parameter rds-master-secret-arn)"
          app_secret_arn="$(parameter application-secret-arn)"
          certificate_arn="$(parameter certificate-arn)"
          route53_zone_id="$(parameter route53-zone-id)"
          public_host="$(parameter public-host)"
          game_host="$(parameter game-host)"
          evidence_bucket="$(parameter deployment-evidence-bucket)"
          ecr_prefix="$(parameter ecr-prefix)"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          [ "$account_id" = "$EXPECTED_AWS_ACCOUNT_ID" ] || { echo "Authenticated AWS account $account_id does not match AWS_ACCOUNT_ID." >&2; exit 1; }
          ecr_registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          if [ "$ENVIRONMENT_INPUT" = staging ]; then
            otp_mode="${OTP_MODE_INPUT:-mock}"
            jazzcash_mode="${JAZZCASH_MODE_INPUT:-mock}"
            debug_otp="${ALLOW_DEBUG_OTP_INPUT:-true}"
          else
            otp_mode="${OTP_MODE_INPUT:-disabled}"
            jazzcash_mode="${JAZZCASH_MODE_INPUT:-disabled}"
            debug_otp="${ALLOW_DEBUG_OTP_INPUT:-false}"
            [ "$otp_mode" = http ] || { echo 'Production requires OTP_PROVIDER_MODE=http.' >&2; exit 1; }
            [ "$jazzcash_mode" = hosted ] || { echo 'Production requires JAZZCASH_MODE=hosted.' >&2; exit 1; }
            [ "$debug_otp" = false ] || { echo 'Production cannot expose debug OTP codes.' >&2; exit 1; }
          fi

          {
            echo "AWS_CONFIG_PREFIX=$prefix"
            echo "EKS_CLUSTER_NAME=$cluster_name"
            echo "LBC_ROLE_ARN=$lbc_role_arn"
            echo "LBC_CHART_VERSION=$lbc_chart_version"
            echo "DB_ENDPOINT=$db_endpoint"
            echo "DB_PORT=$db_port"
            echo "DB_NAME=$db_name"
            echo "DB_SECRET_ARN=$db_secret_arn"
            echo "APP_SECRET_ARN=$app_secret_arn"
            echo "AWS_CERTIFICATE_ARN=$certificate_arn"
            echo "ROUTE53_ZONE_ID=$route53_zone_id"
            echo "PUBLIC_HOST=$public_host"
            echo "GAME_HOST=$game_host"
            echo "PUBLIC_ORIGIN=https://$public_host"
            echo "GAME_ORIGIN=https://$game_host/games"
            echo "DEPLOYMENT_EVIDENCE_BUCKET=$evidence_bucket"
            echo "ECR_PREFIX=$ecr_prefix"
            echo "ECR_REGISTRY=$ecr_registry"
            echo "OTP_PROVIDER_MODE=$otp_mode"
            echo "JAZZCASH_MODE=$jazzcash_mode"
            echo "ALLOW_DEBUG_OTP=$debug_otp"
            echo "IMAGE_TAG=$IMAGE_TAG_INPUT"
          } >> "$GITHUB_ENV"

      - name: Verify staging evidence and promotion records
        if: inputs.require_staging_evidence
        env:
          QUALIFICATION_RECORD: ${{ inputs.qualification_record }}
          CHANGE_RECORD: ${{ inputs.change_record }}
          STAGING_PREFIX: ${{ vars.AWS_STAGING_CONFIG_PREFIX }}
        run: |
          set -euo pipefail
          test -n "$QUALIFICATION_RECORD" || { echo 'A non-sensitive qualification_record is required.' >&2; exit 1; }
          test -n "$CHANGE_RECORD" || { echo 'A non-sensitive change_record is required.' >&2; exit 1; }
          prefix="${STAGING_PREFIX:-/game-arena/staging}"
          bucket="$(aws ssm get-parameter --name "$prefix/deployment-evidence-bucket" --query 'Parameter.Value' --output text)"
          aws s3 cp "s3://${bucket}/staging/${IMAGE_TAG}/latest.json" /tmp/staging-deployment.json --only-show-errors
          jq -e --arg sha "$IMAGE_TAG" '.environment == "staging" and .imageTag == $sha' /tmp/staging-deployment.json >/dev/null

      - name: Verify rollback target was previously healthy
        if: inputs.rollback
        run: aws s3api head-object --bucket "$DEPLOYMENT_EVIDENCE_BUCKET" --key "${{ inputs.environment }}/${IMAGE_TAG}/latest.json" >/dev/null

      - name: Materialize database and application secrets securely
        run: |
          set -euo pipefail
          umask 077
          db_secret="$(aws secretsmanager get-secret-value --secret-id "$DB_SECRET_ARN" --query SecretString --output text)"
          app_secret="$(aws secretsmanager get-secret-value --secret-id "$APP_SECRET_ARN" --query SecretString --output text)"
          db_user="$(jq -er '.username' <<<"$db_secret")"
          db_password="$(jq -er '.password' <<<"$db_secret")"
          encoded_user="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$db_user")"
          encoded_password="$(python -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$db_password")"
          database_url="postgresql://${encoded_user}:${encoded_password}@${DB_ENDPOINT}:${DB_PORT}/${DB_NAME}?sslmode=require"

          value() { jq -er --arg key "$1" '.[$key] // ""' <<<"$app_secret"; }
          otp_primary_name="$(value otp_primary_name)"
          otp_primary_endpoint="$(value otp_primary_endpoint)"
          otp_primary_api_key="$(value otp_primary_api_key)"
          otp_secondary_name="$(value otp_secondary_name)"
          otp_secondary_endpoint="$(value otp_secondary_endpoint)"
          otp_secondary_api_key="$(value otp_secondary_api_key)"
          jazzcash_webhook_secret="$(value jazzcash_webhook_secret)"
          jazzcash_merchant_id="$(value jazzcash_merchant_id)"
          jazzcash_password="$(value jazzcash_password)"
          jazzcash_integrity_salt="$(value jazzcash_integrity_salt)"
          jazzcash_action_url="$(value jazzcash_action_url)"
          topup_offers_json="$(value topup_offers_json)"
          voucher_codes_json="$(value voucher_codes_json)"

          test -n "$jazzcash_webhook_secret"
          jq -e 'type == "array"' <<<"$topup_offers_json" >/dev/null
          jq -e 'type == "object"' <<<"$voucher_codes_json" >/dev/null
          if [ "${{ inputs.environment }}" = production ]; then
            test -n "$otp_primary_endpoint" && test -n "$otp_primary_api_key"
            test -n "$jazzcash_merchant_id" && test -n "$jazzcash_password"
            test -n "$jazzcash_integrity_salt" && test -n "$jazzcash_action_url"
            case "$otp_primary_endpoint" in https://*) ;; *) echo 'Primary OTP endpoint must use HTTPS.' >&2; exit 1 ;; esac
            case "$jazzcash_action_url" in https://*) ;; *) echo 'JazzCash action URL must use HTTPS.' >&2; exit 1 ;; esac
            if [ -n "$otp_secondary_endpoint" ] || [ -n "$otp_secondary_api_key" ]; then
              test -n "$otp_secondary_endpoint" && test -n "$otp_secondary_api_key"
              case "$otp_secondary_endpoint" in https://*) ;; *) echo 'Secondary OTP endpoint must use HTTPS.' >&2; exit 1 ;; esac
            fi
          fi

          for secret in "$db_user" "$db_password" "$database_url" \
            "$otp_primary_api_key" "$otp_secondary_api_key" "$jazzcash_webhook_secret" \
            "$jazzcash_merchant_id" "$jazzcash_password" "$jazzcash_integrity_salt"; do
            [ -z "$secret" ] || echo "::add-mask::$secret"
          done

          python - "$database_url" "$otp_primary_name" "$otp_primary_endpoint" \
            "$otp_primary_api_key" "$otp_secondary_name" "$otp_secondary_endpoint" \
            "$otp_secondary_api_key" "$jazzcash_webhook_secret" "$jazzcash_merchant_id" \
            "$jazzcash_password" "$jazzcash_integrity_salt" "$jazzcash_action_url" \
            "$topup_offers_json" "$voucher_codes_json" <<'PY'
          import sys
          from pathlib import Path

          names = [
              "DATABASE_URL", "OTP_PRIMARY_NAME", "OTP_PRIMARY_ENDPOINT", "OTP_PRIMARY_API_KEY",
              "OTP_SECONDARY_NAME", "OTP_SECONDARY_ENDPOINT", "OTP_SECONDARY_API_KEY",
              "JAZZCASH_WEBHOOK_SECRET", "JAZZCASH_MERCHANT_ID", "JAZZCASH_PASSWORD",
              "JAZZCASH_INTEGRITY_SALT", "JAZZCASH_ACTION_URL", "TOPUP_OFFERS_JSON",
              "VOUCHER_CODES_JSON",
          ]
          values = sys.argv[1:]
          if len(values) != len(names):
              raise SystemExit("runtime secret argument count mismatch")
          if any("\n" in value or "\r" in value for value in values):
              raise SystemExit("runtime secret values must be single-line")
          Path("/tmp/game-arena-runtime.env").write_text(
              "".join(f"{name}={value}\n" for name, value in zip(names, values)),
              encoding="utf-8",
          )
          PY
          chmod 600 /tmp/game-arena-runtime.env

      - name: Configure EKS access
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
          kubectl cluster-info
          kubectl auth can-i create deployments --namespace game-arena
          kubectl auth can-i create secrets --namespace game-arena

      - name: Install or upgrade AWS Load Balancer Controller
        run: |
          set -euo pipefail
          vpc_id="$(aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --query 'cluster.resourcesVpcConfig.vpcId' --output text)"
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --version "$LBC_CHART_VERSION" \
            --set clusterName="$EKS_CLUSTER_NAME" \
            --set region="$AWS_REGION" \
            --set vpcId="$vpc_id" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set-string serviceAccount.annotations.eks\.amazonaws\.com/role-arn="$LBC_ROLE_ARN" \
            --wait --timeout 10m
          kubectl -n kube-system rollout status deployment/aws-load-balancer-controller --timeout=300s

      - name: Promote immutable images from GHCR to environment ECR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          for component in api web admin games; do
            repository="$ECR_PREFIX/$component"
            if ! aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
              source="ghcr.io/game-arena-codistan/platform-${component}:${IMAGE_TAG}"
              target="${ECR_REGISTRY}/${repository}:${IMAGE_TAG}"
              docker pull "$source"
              docker tag "$source" "$target"
              docker push "$target"
            fi
            aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$IMAGE_TAG" >/dev/null
          done

      - name: Block production images with unavailable or severe scan findings
        if: inputs.environment == 'production'
        run: |
          set -euo pipefail
          for component in api web admin games; do
            repository="$ECR_PREFIX/$component"
            aws ecr wait image-scan-complete --repository-name "$repository" --image-id imageTag="$IMAGE_TAG"
            findings="$(aws ecr describe-image-scan-findings \
              --repository-name "$repository" \
              --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanFindings.findingSeverityCounts' \
              --output json)"
            jq -e 'type == "object"' <<<"$findings" >/dev/null
            critical="$(jq -r '.CRITICAL // 0' <<<"$findings")"
            high="$(jq -r '.HIGH // 0' <<<"$findings")"
            [ "$critical" -eq 0 ] && [ "$high" -eq 0 ] || { echo "$repository has CRITICAL=$critical HIGH=$high findings." >&2; exit 1; }
          done

      - name: Create namespace and runtime secrets
        run: |
          set -euo pipefail
          test -s /tmp/game-arena-runtime.env
          kubectl create namespace game-arena --dry-run=client -o yaml | kubectl apply -f -
          return_url="${PUBLIC_ORIGIN}/api/v1/payments/jazzcash/return"
          kubectl -n game-arena create secret generic game-arena-secrets \
            --from-env-file=/tmp/game-arena-runtime.env \
            --from-literal=DATABASE_SSL=true \
            --from-literal=JAZZCASH_RETURN_URL="$return_url" \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/game-arena-runtime.env

      - name: Render AWS Kubernetes manifests with ECR images
        run: |
          set -euo pipefail
          export DEPLOY_ENVIRONMENT="${{ inputs.environment }}"
          export PUBLIC_ORIGIN
          export ALLOWED_ORIGINS="$PUBLIC_ORIGIN"
          export GAME_ORIGIN
          export GAME_HOSTS="$GAME_HOST"
          export DATABASE_SSL=true
          export OTP_PROVIDER_MODE
          export ALLOW_DEBUG_OTP
          export JAZZCASH_MODE
          export AWS_CERTIFICATE_ARN
          mkdir -p /tmp/game-arena
          node scripts/render-kubernetes.mjs infra/kubernetes/platform.yaml /tmp/game-arena/platform.yaml
          node scripts/render-kubernetes.mjs infra/kubernetes/admin.yaml /tmp/game-arena/admin.yaml
          node scripts/render-kubernetes.mjs infra/kubernetes/migration-job.yaml /tmp/game-arena/migration-job.yaml
          node scripts/render-kubernetes.mjs infra/kubernetes/edge-aws.yaml /tmp/game-arena/edge.yaml
          for file in /tmp/game-arena/platform.yaml /tmp/game-arena/admin.yaml /tmp/game-arena/migration-job.yaml; do
            sed -i '/imagePullSecrets:.*ghcr-pull/d' "$file"
            for component in api web admin games; do
              sed -i "s#ghcr.io/game-arena-codistan/platform-${component}:${IMAGE_TAG}#${ECR_REGISTRY}/${ECR_PREFIX}/${component}:${IMAGE_TAG}#g" "$file"
            done
          done

      - name: Run backwards-compatible database migrations
        if: inputs.run_migrations
        run: |
          set -euo pipefail
          kubectl -n game-arena delete job game-arena-migrate --ignore-not-found=true --wait=true
          kubectl apply -f /tmp/game-arena/migration-job.yaml
          if ! kubectl -n game-arena wait --for=condition=complete job/game-arena-migrate --timeout=600s; then
            kubectl -n game-arena logs job/game-arena-migrate --all-containers=true || true
            exit 1
          fi
          kubectl -n game-arena logs job/game-arena-migrate --all-containers=true

      - name: Deploy application and AWS edge
        run: |
          set -euo pipefail
          kubectl apply -f /tmp/game-arena/platform.yaml
          kubectl apply -f /tmp/game-arena/admin.yaml
          kubectl apply -f /tmp/game-arena/edge.yaml
          for deployment in api web admin game-origin; do
            kubectl -n game-arena rollout status "deployment/$deployment" --timeout=600s
            kubectl -n game-arena annotate "deployment/$deployment" gamearena.io/release-sha="$IMAGE_TAG" --overwrite
          done

      - name: Upsert Route 53 aliases to the provisioned ALB
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            alb_dns="$(kubectl -n game-arena get ingress game-arena-aws -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)"
            [ -n "$alb_dns" ] && break
            sleep 10
          done
          test -n "$alb_dns" || { echo 'ALB hostname was not assigned.' >&2; exit 1; }
          alb_zone="$(aws elbv2 describe-load-balancers --query "LoadBalancers[?DNSName=='$alb_dns'].CanonicalHostedZoneId | [0]" --output text)"
          test -n "$alb_zone" && [ "$alb_zone" != None ]
          jq -n \
            --arg public "$PUBLIC_HOST" \
            --arg game "$GAME_HOST" \
            --arg dns "$alb_dns" \
            --arg zone "$alb_zone" \
            '{Comment:"Game Arena GitHub deployment",Changes:[
              {Action:"UPSERT",ResourceRecordSet:{Name:$public,Type:"A",AliasTarget:{HostedZoneId:$zone,DNSName:$dns,EvaluateTargetHealth:true}}},
              {Action:"UPSERT",ResourceRecordSet:{Name:$game,Type:"A",AliasTarget:{HostedZoneId:$zone,DNSName:$dns,EvaluateTargetHealth:true}}}
            ]}' > /tmp/route53-change.json
          aws route53 change-resource-record-sets --hosted-zone-id "$ROUTE53_ZONE_ID" --change-batch file:///tmp/route53-change.json >/tmp/route53-result.json
          echo "ALB_DNS=$alb_dns" >> "$GITHUB_ENV"

      - name: Verify internal and external health
        run: |
          set -euo pipefail
          kubectl -n game-arena port-forward service/api 18081:8081 >/tmp/api-port-forward.log 2>&1 & api_pf=$!
          kubectl -n game-arena port-forward service/game-origin 18082:8080 >/tmp/games-port-forward.log 2>&1 & games_pf=$!
          trap 'kill "$api_pf" "$games_pf" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:18081/readyz >/dev/null && break; sleep 2; done
          curl --fail --silent http://127.0.0.1:18081/readyz
          curl --fail --silent http://127.0.0.1:18082/healthz
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 20 "https://${PUBLIC_HOST}/api/healthz" >/dev/null && \
               curl --fail --silent --show-error --max-time 20 "https://${GAME_HOST}/healthz" >/dev/null; then
              break
            fi
            sleep 10
          done
          curl --fail --silent --show-error "https://${PUBLIC_HOST}/api/healthz"
          curl --fail --silent --show-error "https://${GAME_HOST}/healthz"
          headers="$(curl --fail --silent --show-error --head "https://${PUBLIC_HOST}/")"
          grep -qi '^x-content-type-options: *nosniff' <<<"$headers"
          grep -qi '^referrer-policy:' <<<"$headers"

      - name: Capture deployment evidence
        env:
          QUALIFICATION_RECORD: ${{ inputs.qualification_record }}
          CHANGE_RECORD: ${{ inputs.change_record }}
          DEPLOYMENT_REASON: ${{ inputs.deployment_reason }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/game-arena-evidence
          kubectl -n game-arena get deployments,pods,services,ingress -o wide > /tmp/game-arena-evidence/kubernetes.txt
          kubectl -n game-arena get events --sort-by=.lastTimestamp > /tmp/game-arena-evidence/events.txt
          jq -n \
            --arg environment "${{ inputs.environment }}" \
            --arg imageTag "$IMAGE_TAG" \
            --arg actor "$GITHUB_ACTOR" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg publicOrigin "$PUBLIC_ORIGIN" \
            --arg gameOrigin "$GAME_ORIGIN" \
            --arg alb "$ALB_DNS" \
            --arg reason "$DEPLOYMENT_REASON" \
            --arg qualificationRecord "$QUALIFICATION_RECORD" \
            --arg changeRecord "$CHANGE_RECORD" \
            --argjson migrations '${{ inputs.run_migrations }}' \
            --argjson rollback '${{ inputs.rollback }}' \
            '{environment:$environment,imageTag:$imageTag,actor:$actor,runId:$runId,runAttempt:$runAttempt,repository:$repository,publicOrigin:$publicOrigin,gameOrigin:$gameOrigin,loadBalancer:$alb,reason:$reason,qualificationRecord:$qualificationRecord,changeRecord:$changeRecord,migrations:$migrations,rollback:$rollback,recordedAt:(now|todate)}' \
            > /tmp/game-arena-evidence/deployment.json
          prefix="${{ inputs.environment }}/${IMAGE_TAG}"
          aws s3 cp /tmp/game-arena-evidence/ "s3://${DEPLOYMENT_EVIDENCE_BUCKET}/${prefix}/${GITHUB_RUN_ID}/" --recursive
          aws s3 cp /tmp/game-arena-evidence/deployment.json "s3://${DEPLOYMENT_EVIDENCE_BUCKET}/${prefix}/latest.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-${{ inputs.environment }}-deployment-${{ inputs.image_tag }}-${{ github.run_id }}
          path: /tmp/game-arena-evidence
          retention-days: 90

      - name: Publish deployment summary
        run: |
          {
            echo '## Game Arena AWS deployment'
            echo "- Environment: ${{ inputs.environment }}"
            echo "- Image SHA: $IMAGE_TAG"
            echo "- Player: $PUBLIC_ORIGIN"
            echo "- Games: $GAME_ORIGIN"
            echo "- EKS cluster: $EKS_CLUSTER_NAME"
            echo "- ALB: $ALB_DNS"
            echo "- Migrations: ${{ inputs.run_migrations }}"
            echo "- Rollback: ${{ inputs.rollback }}"
            echo "- Evidence: s3://$DEPLOYMENT_EVIDENCE_BUCKET/${{ inputs.environment }}/$IMAGE_TAG/$GITHUB_RUN_ID/"
          } >> "$GITHUB_STEP_SUMMARY"
