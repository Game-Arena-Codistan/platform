name: AWS staging synthetic journeys

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    if: vars.AWS_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: game-arena-synthetic-${{ github.run_id }}

      - name: Resolve staging origins
        env:
          CONFIG_PREFIX_INPUT: ${{ vars.AWS_CONFIG_PREFIX }}
        run: |
          set -euo pipefail
          prefix="${CONFIG_PREFIX_INPUT:-/game-arena/staging}"
          public_host="$(aws ssm get-parameter --name "$prefix/public-host" --query 'Parameter.Value' --output text)"
          game_host="$(aws ssm get-parameter --name "$prefix/game-host" --query 'Parameter.Value' --output text)"
          {
            echo "PLAYER_URL=https://${public_host}"
            echo "API_HEALTH_URL=https://${public_host}/api/healthz"
            echo "GAME_HEALTH_URL=https://${game_host}/healthz"
          } >> "$GITHUB_ENV"

      - name: Verify public endpoints and TLS
        run: |
          set -euo pipefail
          for url in "$PLAYER_URL" "$API_HEALTH_URL" "$GAME_HEALTH_URL"; do
            curl --fail --silent --show-error --location --max-time 20 --retry 3 --retry-all-errors "$url" >/dev/null
          done

      - name: Verify player security headers
        run: |
          set -euo pipefail
          headers="$(curl --fail --silent --show-error --head --max-time 20 "$PLAYER_URL")"
          grep -qi '^x-content-type-options: *nosniff' <<<"$headers"
          grep -qi '^referrer-policy:' <<<"$headers"

      - name: Publish synthetic summary
        run: |
          {
            echo '## AWS staging synthetic result'
            echo "- Player: $PLAYER_URL"
            echo "- API health: $API_HEALTH_URL"
            echo "- Game health: $GAME_HEALTH_URL"
            echo '- Result: passed'
          } >> "$GITHUB_STEP_SUMMARY"
