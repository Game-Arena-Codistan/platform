name: AWS staging deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full commit SHA to deploy; defaults to current main SHA
        required: false
        type: string
      confirmation:
        description: Enter STAGE to continue
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: aws-staging-deployment
  cancel-in-progress: false

jobs:
  guard:
    runs-on: [self-hosted, linux, x64, game-arena-ci]
    steps:
      - name: Confirm intentional staging deployment
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = STAGE || { echo 'confirmation must be STAGE.' >&2; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo 'image_tag must be a full 40-character commit SHA.' >&2; exit 1; }

  deploy:
    needs: guard
    uses: ./.github/workflows/aws-deploy.yml
    with:
      environment: staging
      image_tag: ${{ inputs.image_tag || github.sha }}
      run_migrations: true
      require_staging_evidence: false
      rollback: false
      deployment_reason: Explicit protected staging deployment
    secrets: inherit

  runtime-controls:
    needs: deploy
    if: needs.deploy.result == 'success'
    uses: ./.github/workflows/aws-runtime-controls.yml
    with:
      environment: staging
    secrets: inherit
