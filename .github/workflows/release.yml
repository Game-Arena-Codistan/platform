name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the built commit to the production environment
        type: boolean
        default: false
permissions: {contents: read, packages: write}
concurrency: {group: "release-${{ github.ref }}", cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {name: api, context: apps/api}
          - {name: web, context: apps/web}
          - {name: admin, context: apps/admin}
          - {name: games, context: apps/game-origin}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/game-arena-codistan/platform-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/game-arena-codistan/platform-${{ matrix.name }}:main
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions: {contents: read, packages: read}
    steps:
      - uses: actions/checkout@v4
      - name: Configure cluster access
        env: {KUBE_CONFIG_B64: "${{ secrets.KUBE_CONFIG_B64 }}"}
        run: |
          test -n "$KUBE_CONFIG_B64"
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Run backwards-compatible migrations
        env: {DATABASE_URL: "${{ secrets.DATABASE_URL }}", DATABASE_SSL: "true"}
        run: |
          test -n "$DATABASE_URL"
          docker run --rm -e DATABASE_URL -e DATABASE_SSL ghcr.io/game-arena-codistan/platform-api:${{ github.sha }} npm run migrate
      - name: Apply platform configuration
        run: |
          sed "s/REPLACE_IMAGE_TAG/${{ github.sha }}/g" infra/kubernetes/platform.yaml | kubectl apply -f -
          sed "s/REPLACE_IMAGE_TAG/${{ github.sha }}/g" infra/kubernetes/admin.yaml | kubectl apply -f -
          kubectl -n game-arena rollout status deployment/api --timeout=180s
          kubectl -n game-arena rollout status deployment/web --timeout=180s
          kubectl -n game-arena rollout status deployment/admin --timeout=180s
          kubectl -n game-arena rollout status deployment/game-origin --timeout=180s
      - name: Verify deployment health
        env: {HEALTH_URL: "${{ vars.PRODUCTION_HEALTH_URL }}"}
        run: |
          test -n "$HEALTH_URL"
          for attempt in $(seq 1 20); do curl --fail --silent --show-error "$HEALTH_URL" && exit 0; sleep 5; done
          exit 1
