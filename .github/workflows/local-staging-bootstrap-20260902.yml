name: Bootstrap corrected 60-game local staging publication

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/local-staging-bootstrap-20260902.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected protected 60-game local staging workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run game-content-local-staging.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag=portfolio-ingress-60-20260901
