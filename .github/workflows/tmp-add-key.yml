name: tmp-add-key
on:
  workflow_dispatch:

jobs:
  add:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS || vars.DEPLOY_SSH_KNOWN_HOSTS }}
      MY_PUBKEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAA15xx9S8KYMHkwk78RpznxP+T4GwOiOka0mLa6Xxea my-laptop-login"
    steps:
      - run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/k"
          chmod 600 "$HOME/.ssh/k"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$MY_PUBKEY" | ssh -i "$HOME/.ssh/k" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            read -r key
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys
            grep -v "rsa-key-20261120" ~/.ssh/authorized_keys > ~/.ssh/ak.tmp || true
            cat ~/.ssh/ak.tmp > ~/.ssh/authorized_keys && rm -f ~/.ssh/ak.tmp
            grep -qxF "$key" ~/.ssh/authorized_keys || echo "$key" >> ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys
            awk "{print \$1, \$NF}" ~/.ssh/authorized_keys
          '
