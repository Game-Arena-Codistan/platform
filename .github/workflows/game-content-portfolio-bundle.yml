name: Import 60-game staging bundle

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft GitHub release containing bundle-registry.json and 60 normalized game ZIPs
        required: true
        type: string
      publish_to_staging:
        description: Publish scanner-approved immutable builds to staging
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: game-content-60-bundle-staging
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 120
    env:
      GAME_ARENA_MAX_COMPRESSED_BYTES: '134217728'
      GAME_ARENA_MAX_EXPANDED_BYTES: '536870912'
      GAME_ARENA_MAX_ENTRIES: '10000'
      GAME_ARENA_MAX_COMPRESSION_RATIO: '250'
      GAME_ARENA_EXTRACTION_TIMEOUT_MS: '120000'
      GAME_ARENA_FREE_SPACE_RESERVE_BYTES: '1073741824'
      GAME_ARENA_ACTOR: github-actions:${{ github.actor }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Prepare isolated bundle workspace
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "game-arena-bundle-$env:GITHUB_RUN_ID"
          $registry = Join-Path $root 'registry'
          $ingress = Join-Path $root 'ingress'
          $artifacts = Join-Path $root 'artifacts'
          $audit = Join-Path $root 'audit'
          New-Item -ItemType Directory -Force -Path $root, $registry, $ingress, $artifacts, $audit, 'apps/game-ops/reports', 'catalogue/releases' | Out-Null
          "BUNDLE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUNDLE_REGISTRY=$(Join-Path $registry 'bundle-registry.json')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download and validate private bundle registry
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { throw 'release_tag is required.' }

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'GameArenaBundleImporter/1.0'
          }
          $encodedTag = [Uri]::EscapeDataString($tag)
          $release = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag" -Headers $headers
          if (-not $release.draft) { throw 'Bundle ingress release must remain draft/private.' }

          $registryAssets = @($release.assets | Where-Object { $_.name -eq 'bundle-registry.json' })
          if ($registryAssets.Count -ne 1) { throw "Expected exactly one bundle-registry.json asset; found $($registryAssets.Count)." }

          $downloadHeaders = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/octet-stream'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'GameArenaBundleImporter/1.0'
          }
          Invoke-WebRequest -Uri $registryAssets[0].url -Headers $downloadHeaders -OutFile $env:BUNDLE_REGISTRY -UseBasicParsing

          $registry = Get-Content -LiteralPath $env:BUNDLE_REGISTRY -Raw | ConvertFrom-Json
          if ($registry.schemaVersion -ne 1) { throw 'Bundle registry schemaVersion must be 1.' }
          if ($registry.productionActivation -ne $false) { throw 'Bundle registry must disable production activation.' }
          $games = @($registry.games)
          if ($games.Count -ne 60) { throw "Bundle registry must contain exactly 60 games; found $($games.Count)." }

          $slugs = @{}
          $assets = @{}
          foreach ($game in $games) {
            $slug = [string]$game.slug
            $assetName = [string]$game.assetName
            $sha = [string]$game.sha256
            if ($slug -notmatch '^[a-z0-9][a-z0-9-]{1,63}$') { throw "Invalid slug in registry: $slug" }
            if ($slugs.ContainsKey($slug)) { throw "Duplicate slug in registry: $slug" }
            $slugs[$slug] = $true
            if ($assetName -notmatch '^[a-z0-9][a-z0-9-]{1,63}\.zip$' -or $assetName.Contains('/') -or $assetName.Contains('\')) { throw "Unsafe asset name: $assetName" }
            if ($assets.ContainsKey($assetName)) { throw "Duplicate asset name in registry: $assetName" }
            $assets[$assetName] = $true
            if ([int64]$game.compressedBytes -le 0 -or [int64]$game.compressedBytes -gt 134217728) { throw "Invalid compressed size for $slug." }
            if ($sha -notmatch '^[a-f0-9]{64}$') { throw "Invalid SHA-256 for $slug." }
            if ($game.manifest.rolloutPercentage -ne 0) { throw "Rollout must remain zero: $slug" }
          }
          Write-Host "Validated 60-game draft registry for release $tag."

      - name: Download and verify all 60 release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ingress = Join-Path $env:BUNDLE_ROOT 'ingress'
          $output = & node apps/game-ops/src/download-pilot-release.mjs `
            --tag "${{ inputs.release_tag }}" `
            --registry "$env:BUNDLE_REGISTRY" `
            --output "$ingress" 2>&1
          if ($LASTEXITCODE -ne 0) { $output | Write-Host; throw 'Bundle asset download or digest verification failed.' }
          $output | Tee-Object -FilePath 'apps/game-ops/reports/bundle-download.json'

      - name: Preflight, scan and package all 60 builds
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ingress = Join-Path $env:BUNDLE_ROOT 'ingress'
          $artifacts = Join-Path $env:BUNDLE_ROOT 'artifacts'
          $audit = Join-Path $env:BUNDLE_ROOT 'audit'
          $output = & node apps/game-ops/src/import-pilot-release.mjs `
            --registry "$env:BUNDLE_REGISTRY" `
            --ingress "$ingress" `
            --output "$artifacts" `
            --audit "$audit" `
            --report 'apps/game-ops/reports/portfolio-bundle-import.json' 2>&1
          if ($LASTEXITCODE -ne 0) { $output | Write-Host; throw 'Bundle preflight, scan or packaging failed.' }
          $output | Write-Host

      - name: Validate game operations package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location apps/game-ops
          try {
            & npm run ci
            if ($LASTEXITCODE -ne 0) { throw 'Game operations validation failed.' }
          } finally { Pop-Location }

      - name: Create review-only release metadata
        shell: pwsh
        run: |
          $gamesRoot = Join-Path $env:BUNDLE_ROOT 'artifacts/games'
          $manifests = @(Get-ChildItem -Path $gamesRoot -Filter game-manifest.json -Recurse | Sort-Object FullName)
          if ($manifests.Count -ne 60) { throw "Expected 60 packaged manifests; found $($manifests.Count)." }
          foreach ($item in $manifests) {
            $manifest = Get-Content -LiteralPath $item.FullName -Raw | ConvertFrom-Json
            if ($manifest.rolloutPercentage -ne 0) { throw "Bundle rollout must remain zero: $($manifest.slug)" }
            $target = Join-Path 'catalogue/releases' $manifest.slug
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            $review = [ordered]@{
              schemaVersion=$manifest.schemaVersion; slug=$manifest.slug; title=$manifest.title; version=$manifest.version
              entrypoint=$manifest.entrypoint; buildSha256=$manifest.buildSha256; totalBytes=$manifest.totalBytes
              fileCount=$manifest.fileCount; permissions=$manifest.permissions; bridgeVersion=$manifest.bridgeVersion
              minDeviceTier=$manifest.minDeviceTier; rolloutPercentage=0; publishedAt=$manifest.publishedAt
              publishedBy=$manifest.publishedBy; scan=$manifest.scan; productionActivation=$false
              ingressRelease="${{ inputs.release_tag }}"
            }
            $reviewPath = Join-Path $target "$($manifest.version).json"
            $review | ConvertTo-Json -Depth 12 | Set-Content -LiteralPath $reviewPath -Encoding utf8
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: game-portfolio-bundle-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/game-arena-bundle-${{ github.run_id }}/audit
            apps/game-ops/reports
            catalogue/releases
          retention-days: 30
          if-no-files-found: error

      - name: Validate protected AWS account
        if: inputs.publish_to_staging
        shell: pwsh
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if ($env:EXPECTED_AWS_ACCOUNT_ID -notmatch '^\d{12}$') { throw 'AWS_ACCOUNT_ID must be a twelve-digit protected staging variable.' }

      - name: Authenticate to AWS through staging OIDC role
        if: inputs.publish_to_staging
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_GAME_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: game-arena-portfolio-bundle-${{ github.run_id }}

      - name: Publish immutable bundle versions to staging
        if: inputs.publish_to_staging
        shell: pwsh
        env:
          CONFIG_PREFIX_INPUT: ${{ vars.AWS_CONFIG_PREFIX }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          $account = aws sts get-caller-identity --query Account --output text
          if ($LASTEXITCODE -ne 0 -or $account -ne $env:EXPECTED_AWS_ACCOUNT_ID) { throw "Unexpected AWS account: $account" }

          $prefix = if ($env:CONFIG_PREFIX_INPUT) { $env:CONFIG_PREFIX_INPUT } else { '/game-arena/staging' }
          $bucket = aws ssm get-parameter --name "$prefix/game-artifact-bucket" --query Parameter.Value --output text
          if ($LASTEXITCODE -ne 0 -or -not $bucket) { throw 'Unable to resolve staging game artifact bucket.' }

          $gamesRoot = Join-Path $env:BUNDLE_ROOT 'artifacts/games'
          $manifests = @(Get-ChildItem -Path $gamesRoot -Filter game-manifest.json -Recurse | Sort-Object FullName)
          foreach ($item in $manifests) {
            $manifest = Get-Content -LiteralPath $item.FullName -Raw | ConvertFrom-Json
            $key = "games/$($manifest.slug)/$($manifest.version)/game-manifest.json"
            $head = & aws s3api head-object --bucket $bucket --key $key 2>&1
            $headExit = $LASTEXITCODE
            if ($headExit -eq 0) {
              $remoteManifestPath = Join-Path $env:BUNDLE_ROOT "remote-$($manifest.slug)-manifest.json"
              & aws s3 cp "s3://$bucket/$key" $remoteManifestPath --only-show-errors
              if ($LASTEXITCODE -ne 0) { throw "Unable to verify existing immutable version: $($manifest.slug)" }
              $remote = Get-Content -LiteralPath $remoteManifestPath -Raw | ConvertFrom-Json
              if ($remote.buildSha256 -ne $manifest.buildSha256) { throw "Immutable version collision: $($manifest.slug)@$($manifest.version)" }
              Write-Host "Verified existing matching immutable version: $($manifest.slug)@$($manifest.version)"
            } else {
              $headText = $head | Out-String
              if ($headText -notmatch '(?i)(Not Found|404|NoSuchKey)') { throw "S3 existence check failed for $($manifest.slug): $headText" }
              $source = Split-Path -LiteralPath $item.FullName -Parent
              & aws s3 sync $source "s3://$bucket/games/$($manifest.slug)/$($manifest.version)/" --only-show-errors --cache-control 'public,max-age=31536000,immutable' --sse aws:kms
              if ($LASTEXITCODE -ne 0) { throw "S3 publication failed: $($manifest.slug)" }
            }
          }

      - name: Open metadata review pull request
        if: inputs.publish_to_staging
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Git([string[]]$Arguments) { & git @Arguments; if ($LASTEXITCODE -ne 0) { throw "git failed: $($Arguments -join ' ')" } }
          $branch = "content/portfolio-bundle-$env:GITHUB_RUN_ID"
          Invoke-Git @('switch','-c',$branch)
          Invoke-Git @('config','user.name','game-arena-content-bot')
          Invoke-Git @('config','user.email','game-arena-content-bot@users.noreply.github.com')
          Invoke-Git @('add','catalogue/releases','apps/game-ops/reports')
          & git diff --cached --quiet
          $diffExit = $LASTEXITCODE
          if ($diffExit -eq 0) { throw 'No release metadata was generated.' }
          if ($diffExit -ne 1) { throw "git diff failed with exit code $diffExit" }
          Invoke-Git @('commit','-m','Games: record 60-game staging bundle')
          Invoke-Git @('push','--set-upstream','origin',$branch)
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $body = @{
            title='Games: review 60-game staging bundle'
            head=$branch
            base='main'
            body="Sixty scanner-approved immutable builds were published to staging through the protected game-content role. Rollout remains 0% and production activation is disabled. Tracks #74 and #79."
          } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/pulls" -Headers $headers -Body $body -ContentType 'application/json' | ConvertTo-Json -Depth 5

      - name: Clean bundle workspace
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath $env:BUNDLE_ROOT -Recurse -Force -ErrorAction SilentlyContinue
