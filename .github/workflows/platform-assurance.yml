name: Platform assurance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '40 3 * * 2'

permissions: {contents: read}

jobs:
  assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 22}
      - name: Repository checks
        run: node scripts/security-check.mjs
      - name: AI-native repository controls
        run: node scripts/check-ai-native-readiness.mjs
      - name: Permanent staging certification controls
        run: node scripts/check-staging-certification.mjs
      - name: Pre-staging controls
        run: node scripts/check-pre-staging.mjs
      - name: Frontend-backend contract
        run: node scripts/check-api-contract.mjs
      - name: Indexed PostgreSQL reporting
        run: node scripts/check-indexed-postgres-reports.mjs
      - name: Optional self-hosted workflow controls
        run: node scripts/check-self-hosted-workflows.mjs
      - name: Cloud deployment checks
        run: node scripts/check-cloud-deployment.mjs
      - name: API dependencies
        working-directory: apps/api
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: API checks
        working-directory: apps/api
        run: npm run ci
      - name: Game isolation checks
        working-directory: apps/game-ops
        run: npm run ci
      - name: Bridge checks
        working-directory: packages/game-bridge
        run: npm run ci
      - name: Operations console checks
        working-directory: apps/admin
        run: npm run ci
      - name: Production container builds
        run: |
          docker build -t game-arena-api:assurance apps/api
          docker build -t game-arena-web:assurance apps/web
          docker build -t game-arena-admin:assurance apps/admin
          docker build -t game-arena-games:assurance apps/game-origin
