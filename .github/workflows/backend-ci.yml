name: Backend foundation
on:
  pull_request:
    branches: [main]
    paths: ['apps/api/**','docs/API.md','docs/BACKEND.md','.github/workflows/backend-ci.yml']
  push:
    branches: [main]
    paths: ['apps/api/**','docs/API.md','docs/BACKEND.md','.github/workflows/backend-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - working-directory: apps/api
        run: npm run ci
      - working-directory: apps/api
        run: docker build -t game-arena-api:ci .
