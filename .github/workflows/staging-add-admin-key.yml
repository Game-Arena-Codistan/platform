name: Staging add admin API key

# Appends an extra ADMIN_API_KEYS value on the staging host without removing existing keys,
# then recreates the API so signed-headers staging still accepts the new browser key.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-add-admin-key.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-arena-staging-admin-key
  cancel-in-progress: true

jobs:
  add-key:
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS || vars.DEPLOY_SSH_KNOWN_HOSTS }}
      # Staging-only browser admin key (also shared with the requester out of band).
      EXTRA_ADMIN_KEY: ga-admin-codistan-7e3f9a2c1b8d4e60
    steps:
      - name: Prepare pinned SSH host identity
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_SSH_KEY" && test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          test "${#EXTRA_ADMIN_KEY}" -ge 16
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/game-arena-staging"
          chmod 600 "$HOME/.ssh/game-arena-staging"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Append admin key and reload API
        env:
          EXTRA_ADMIN_KEY: ${{ env.EXTRA_ADMIN_KEY }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/game-arena-staging" -o BatchMode=yes -o ConnectTimeout=30 "$DEPLOY_USER@$DEPLOY_HOST" \
            "EXTRA_ADMIN_KEY='$EXTRA_ADMIN_KEY' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/codistan/platform
          test -f infra/.env
          test -n "${EXTRA_ADMIN_KEY:-}"
          test "${#EXTRA_ADMIN_KEY}" -ge 16

          current="$(grep -m1 '^ADMIN_API_KEYS=' infra/.env | cut -d= -f2- || true)"
          current="${current#\"}"; current="${current%\"}"
          current="${current#\'}"; current="${current%\'}"

          if [ -z "$current" ]; then
            updated="$EXTRA_ADMIN_KEY"
          elif printf '%s' ",$current," | grep -Fq ",$EXTRA_ADMIN_KEY,"; then
            updated="$current"
            echo 'Extra admin key already present; leaving ADMIN_API_KEYS unchanged.'
          else
            updated="$current,$EXTRA_ADMIN_KEY"
            echo 'Appending extra admin key to ADMIN_API_KEYS (existing keys preserved).'
          fi

          escaped="$(printf '%s' "$updated" | sed -e 's/[|&]/\\&/g')"
          if grep -q '^ADMIN_API_KEYS=' infra/.env; then
            sed -i "0,/^ADMIN_API_KEYS=.*/s|^ADMIN_API_KEYS=.*|ADMIN_API_KEYS=${escaped}|" infra/.env
          else
            printf '\nADMIN_API_KEYS=%s\n' "$updated" >> infra/.env
          fi

          IMAGE_TAG=''
          if [ -f .deployed-sha ]; then IMAGE_TAG="$(tr -d '[:space:]' < .deployed-sha)"; fi
          IMAGE_BASE="$(grep -m1 '^IMAGE_BASE=' infra/.env | cut -d= -f2- || true)"
          IMAGE_BASE="${IMAGE_BASE#\"}"; IMAGE_BASE="${IMAGE_BASE%\"}"
          IMAGE_BASE="${IMAGE_BASE:-ghcr.io/game-arena-codistan/platform}"
          export IMAGE_BASE IMAGE_TAG
          echo "IMAGE_BASE=$IMAGE_BASE IMAGE_TAG=$IMAGE_TAG"
          echo "ADMIN_API_KEYS entry count=$(grep -m1 '^ADMIN_API_KEYS=' infra/.env | cut -d= -f2- | awk -F, '{print NF}')"

          compose=(docker compose -f infra/docker-compose.staging.yml --env-file infra/.env)
          if [ -n "$IMAGE_TAG" ]; then
            "${compose[@]}" up -d --no-deps --force-recreate api
          else
            "${compose[@]}" up -d --no-deps api
          fi

          ready=0
          for _ in $(seq 1 60); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8095/api/readyz >/dev/null; then ready=1; break; fi
            sleep 2
          done
          echo "api_ready=$ready"
          if [ "$ready" != 1 ]; then
            "${compose[@]}" ps api || true
            "${compose[@]}" logs --tail=120 api || true
            exit 1
          fi

          # Confirm the running API container received the updated env.
          env_has="$("${compose[@]}" exec -T api sh -c 'printenv ADMIN_API_KEYS' 2>/dev/null || true)"
          if printf '%s' ",$env_has," | grep -Fq ",$EXTRA_ADMIN_KEY,"; then
            echo 'API container env contains the extra admin key.'
          else
            echo "WARNING: API container ADMIN_API_KEYS does not include the extra key yet (len=${#env_has})." >&2
            "${compose[@]}" up -d --no-deps --force-recreate api
            sleep 5
          fi

          code="$(curl --silent --max-time 8 -o /tmp/ga-admin-cap.json -w '%{http_code}' \
            -H "x-admin-key: ${EXTRA_ADMIN_KEY}" \
            -H 'x-admin-request: 1' \
            http://127.0.0.1:8095/api/v1/admin/capabilities || true)"
          echo "capabilities_status=$code"
          head -c 600 /tmp/ga-admin-cap.json || true
          echo
          if [ "$code" != 200 ]; then
            echo 'capabilities probe failed' >&2
            "${compose[@]}" logs --tail=160 api || true
            exit 1
          fi
          grep -q 'admin' /tmp/ga-admin-cap.json
          echo 'Secondary staging admin key is active. Existing ADMIN_API_KEYS entries were preserved.'
          REMOTE
