name: Game runtime QA

on:
  pull_request:
    paths:
      - 'apps/game-ops/**'
      - 'apps/game-origin/**'
      - 'apps/api/src/catalogue/**'
      - 'apps/api/src/services/catalogue-admin.mjs'
      - 'packages/game-bridge/**'
      - 'examples/game-bridge-sample/**'
      - '.github/workflows/game-runtime-qa.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * *'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate ingestion tools and catalogue
        working-directory: apps/game-ops
        run: npm run ci
      - name: Validate Game Bridge SDK
        working-directory: packages/game-bridge
        run: npm run ci
      - name: Validate API catalogue administration tests
        working-directory: apps/api
        run: npm test
      - name: Build controlled game origin
        working-directory: apps/game-origin
        run: docker build -t game-arena-game-origin:ci .

  network-probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Probe live game entry points
        working-directory: apps/game-ops
        env:
          GAME_PROBE_STRICT: '1'
        run: npm run probe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: game-runtime-probe
          path: apps/game-ops/reports/
          retention-days: 14
