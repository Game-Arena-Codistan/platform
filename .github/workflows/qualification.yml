name: Release qualification
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'infra/**'
      - '.github/workflows/qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: game_arena_test
          POSTGRES_PASSWORD: game_arena_test
          POSTGRES_DB: game_arena_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U game_arena_test -d game_arena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://game_arena_test:game_arena_test@127.0.0.1:5432/game_arena_test
      TEST_DATABASE_URL: postgresql://game_arena_test:game_arena_test@127.0.0.1:5432/game_arena_test
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply clean migrations
        run: node scripts/migrate.mjs
      - name: Run PostgreSQL durability tests
        run: node --test test/postgres.test.mjs
  api-load:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Start isolated API
        env:
          NODE_ENV: test
          PORT: 8081
          OTP_PROVIDER_MODE: mock
          JAZZCASH_MODE: mock
          ALLOW_DEBUG_OTP: "true"
          REQUIRE_DATABASE: "false"
        run: |
          node src/server.mjs > /tmp/game-arena-api.log 2>&1 &
          echo $! > /tmp/game-arena-api.pid
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:8081/healthz && break; sleep 1; done
      - name: Run launch-profile load test
        env:
          TARGET_URL: http://127.0.0.1:8081
          DURATION_SECONDS: 10
          CONCURRENCY: 25
          MAX_P95_MS: 500
          MAX_ERROR_RATE: 0.01
        run: npm run load
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-load-report
          path: apps/api/reports/load-test.json
          retention-days: 30
      - name: Stop API
        if: always()
        run: kill $(cat /tmp/game-arena-api.pid) || true
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        working-directory: infra
        run: docker compose -f docker-compose.yml config --quiet
      - name: Validate Kubernetes YAML is renderable
        run: |
          test -s infra/kubernetes/platform.yaml
          grep -q 'kind: Deployment' infra/kubernetes/platform.yaml
          grep -q 'REPLACE_IMAGE_TAG' infra/kubernetes/platform.yaml
