name: Regenerate exact lockfiles once

on:
  pull_request:
    paths:
      - '.github/workflows/regenerate-lockfiles-once.yml'

permissions:
  contents: write

concurrency:
  group: regenerate-lockfiles-once
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Regenerate and verify exact dependency trees
        run: |
          set -euo pipefail
          for directory in apps/api apps/web tests/e2e; do
            rm -f "$directory/package-lock.json"
            (cd "$directory" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
            (cd "$directory" && npm ci --ignore-scripts --no-audit --no-fund)
            rm -rf "$directory/node_modules"
          done
          rm .github/workflows/regenerate-lockfiles-once.yml
          git diff --check
      - name: Commit generated lockfiles
        run: |
          set -euo pipefail
          git config user.name game-arena-release-bot
          git config user.email game-arena-release-bot@users.noreply.github.com
          git add apps/api/package-lock.json apps/web/package-lock.json tests/e2e/package-lock.json .github/workflows/regenerate-lockfiles-once.yml
          git commit -m 'Build: regenerate exact dependency lockfiles'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
