name: Bootstrap 60-game staging publication

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/portfolio-bundle-bootstrap-20260901.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch protected 60-game staging workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run game-content-portfolio-bundle.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag=portfolio-ingress-60-20260901 \
            -f publish_to_staging=true
