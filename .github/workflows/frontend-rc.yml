name: Frontend release candidate

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/frontend-rc.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run ci
      - run: docker build -t game-arena-web:ci .
