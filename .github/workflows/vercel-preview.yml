name: Vercel frontend preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or full commit SHA to preview
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: [self-hosted, windows, x64, game-arena-ci]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 22}

      - name: Verify dedicated runner
        run: bash scripts/check-self-hosted-runner.sh

      - name: Check Vercel configuration
        id: config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Vercel preview skipped: configure VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate frontend
        working-directory: apps/web
        run: npm run ci

      - name: Pull Vercel project settings
        if: steps.config.outputs.configured == 'true'
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npm exec --yes --package=vercel@58.0.0 -- vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview
        if: steps.config.outputs.configured == 'true'
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npm exec --yes --package=vercel@58.0.0 -- vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        if: steps.config.outputs.configured == 'true'
        id: deploy
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(npm exec --yes --package=vercel@58.0.0 -- vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo '## Frontend preview' >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean self-hosted runner
        if: always()
        run: bash scripts/cleanup-self-hosted-runner.sh
