name: Bootstrap Game Arena platform

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/READY'
  pull_request:
    branches: [main]
    paths:
      - 'bootstrap/PR_READY'

permissions:
  contents: write
  issues: write

concurrency:
  group: bootstrap-platform
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA256: 003f313235f7a20ef752aaa6a3811677e353da2cd09f2a582e785a9681c78786
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reassemble and verify release bundle
        run: |
          cat \
            bootstrap/part-000 \
            bootstrap/part-001 \
            bootstrap/part-002 \
            bootstrap/part-003 \
            bootstrap/part-005 \
            bootstrap/part-007 \
            bootstrap/part-009 \
            bootstrap/x011a \
            bootstrap/x011b0 \
            bootstrap/x011b1 \
            bootstrap/x012a \
            bootstrap/x012b \
            bootstrap/x013a \
            bootstrap/x013b \
            | base64 --decode > /tmp/game-arena-platform.tar.xz
          echo "$RELEASE_SHA256  /tmp/game-arena-platform.tar.xz" | sha256sum --check --strict
          rm -rf /tmp/game-arena-platform
          mkdir -p /tmp/game-arena-platform
          tar -xJf /tmp/game-arena-platform.tar.xz -C /tmp/game-arena-platform

      - name: Replace bootstrap repository with release candidate
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='bootstrap/' \
            /tmp/game-arena-platform/game-arena-github-import/ ./
          rm -rf bootstrap

      - name: Validate documentation and backlog
        run: |
          python -m json.tool backlog/issues.json >/dev/null
          python -m json.tool backlog/labels.json >/dev/null
          python -m json.tool backlog/milestones.json >/dev/null
          test -f README.md
          test -f docs/04-system-architecture.md
          test -f docs/08-payments-premium.md
          test -f docs/21-frontend-production-release.md

      - name: Validate frontend release
        working-directory: apps/web
        run: npm run ci

      - name: Build production container
        working-directory: apps/web
        run: docker build -t game-arena-web:bootstrap .

      - name: Commit release candidate
        run: |
          git config user.name 'game-arena-bootstrap[bot]'
          git config user.email 'game-arena-bootstrap[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish Game Arena frontend release candidate'
          git push origin main

      - name: Seed labels, milestones and issues
        run: python3 scripts/seed_github.py "$GITHUB_REPOSITORY"
