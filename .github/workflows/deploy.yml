name: Build and Deploy Game Arena Platform - Staging

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/game-arena-codistan/platform

jobs:

  # ============================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ============================================================
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - admin
          - api
          - game-origin
          - web

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:latest


  # ============================================================
  # DEPLOY TO STAGING SERVER
  # ============================================================
  deploy:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest

    # IMPORTANT:
    # This tells GitHub Actions to use secrets
    # configured under the "staging" environment.
    environment:
      name: staging

    steps:

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true

          script: |

            set -e

            echo "========================================"
            echo "Game Arena Staging Deployment"
            echo "========================================"

            cd /opt/codistan/platform

            echo ""
            echo "Current directory:"
            pwd

            echo ""
            echo "Docker version:"
            docker --version

            echo ""
            echo "Docker Compose version:"
            docker compose version

            # ================================================
            # LOGIN TO GHCR
            # ================================================

            echo ""
            echo "Logging into GitHub Container Registry..."

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            # ================================================
            # PULL LATEST IMAGES
            # ================================================

            echo ""
            echo "Pulling latest Game Arena images..."

            docker compose \
              -f infra/docker-compose.yml \
              --env-file infra/.env \
              pull

            # ================================================
            # START / UPDATE SERVICES
            # ================================================

            echo ""
            echo "Starting Game Arena services..."

            docker compose \
              -f infra/docker-compose.yml \
              --env-file infra/.env \
              up -d \
              --remove-orphans

            # ================================================
            # CLEAN OLD IMAGES
            # ================================================

            echo ""
            echo "Cleaning unused Docker images..."

            docker image prune -f

            # ================================================
            # SHOW STATUS
            # ================================================

            echo ""
            echo "========================================"
            echo "Deployment completed successfully"
            echo "========================================"

            docker compose \
              -f infra/docker-compose.yml \
              --env-file infra/.env \
              ps
