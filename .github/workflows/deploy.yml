name: Build and Deploy Game Arena Platform - Staging

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/game-arena-codistan/platform

jobs:

  # ============================================================
  # BUILD AND PUSH DOCKER IMAGES
  # ============================================================

  build:
    name: Build ${{ matrix.service }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - admin
          - api
          - game-origin
          - web

    permissions:
      contents: read
      packages: write

    steps:

      # ----------------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # LOGIN TO GHCR
      # ----------------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # BUILD AND PUSH
      # ----------------------------------------------------------

      - name: Build and Push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:latest

  # ============================================================
  # DEPLOY TO STAGING SERVER
  # ============================================================

  deploy:
    name: Deploy to Staging

    needs: build

    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      # ----------------------------------------------------------
      # DEPLOY THROUGH SSH
      # ----------------------------------------------------------

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}

          script_stop: true

          envs: IMAGE_BASE

          script: |
            set -e
            echo "=============================================="
            echo " Game Arena Platform - Staging Deployment"
            echo "=============================================="

            # ====================================================
            # SERVER DIRECTORY
            # ====================================================
            cd /opt/codistan/platform
            echo ""
            echo "Current directory:"
            pwd

            # ====================================================
            # DOCKER INFORMATION
            # ====================================================
            echo ""
            echo "Docker version:"
            docker --version
            echo ""
            echo "Docker Compose version:"
            docker compose version

            # ====================================================
            # LOGIN TO GHCR
            # ====================================================
            echo ""
            echo "Logging into GitHub Container Registry..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin
            echo ""
            echo "GHCR login successful."

            # ====================================================
            # VERIFY REQUIRED FILES
            # ====================================================
            echo ""
            echo "=============================================="
            echo "Checking deployment files"
            echo "=============================================="
            test -f infra/docker-compose.staging.yml
            test -f infra/.env
            test -f infra/gateway/nginx.conf
            echo "Required files found."

            # ====================================================
            # SHOW COMPOSE CONFIG
            # ====================================================
            echo ""
            echo "=============================================="
            echo "Validating Docker Compose configuration"
            echo "=============================================="
            docker compose \
              -f infra/docker-compose.staging.yml \
              --env-file infra/.env \
              config > /tmp/game-arena-staging-compose.yml
            echo "Docker Compose configuration is valid."

            # ====================================================
            # SHOW IMAGE CONFIGURATION
            # ====================================================
            echo ""
            echo "=============================================="
            echo "Game Arena images"
            echo "=============================================="
            docker compose \
              -f infra/docker-compose.staging.yml \
              --env-file infra/.env \
              config | grep "image:"

            # ====================================================
            # PULL LATEST IMAGES
            # ====================================================
            echo ""
            echo "=============================================="
            echo "Pulling latest Game Arena images"
            echo "=============================================="
            docker compose \
              -f infra/docker-compose.staging.yml \
              --env-file infra/.env \
              pull
            echo ""
            echo "Latest images pulled."

            # ====================================================
            # STOP OLD SERVICES
            # ====================================================
            echo ""
            echo "=============================================="
            echo "Stopping old Game Arena services"
            echo "=============================================="
            docker compose \
              -f infra/docker-compose.staging.yml \
              --env-file infra/.env \
              down

            # ====================================================
            # START DATABASE + MIGRATION + APPLICATIONS
            # ====================================================
            echo ""
            echo "=============================================="
            echo "Starting Game Arena services"
            echo "=============================================="
            docker compose \
              -f infra/docker-compose.staging.yml \
              --env-file infra/.env \
              up -d

            # ====================================================
            # WAIT FOR SERVICES
            # ====================================================
            echo ""
            echo "Waiting for services to start..."
            sleep 15

            # ====================================================
            # SHOW STATUS
            # ====================================================
            echo ""
            echo "=============================================="
            echo "Game Arena container status"
            echo "=============================================="
            docker compose \
              -f infra/docker-compose.staging.yml \
              --env-file infra/.env \
              ps

            # ====================================================
            # SHOW IMAGES
            # ====================================================
            echo ""
            echo "=============================================="
            echo "Game Arena images in use"
            echo "=============================================="
            docker compose \
              -f infra/docker-compose.staging.yml \
              --env-file infra/.env \
              images

            # ====================================================
            # SHOW RUNNING CONTAINERS
            # ====================================================
            echo ""
            echo "=============================================="
            echo "Game Arena running containers"
            echo "=============================================="
            docker ps \
              --filter "label=com.docker.compose.project" \
              --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

            # ====================================================
            # CLEAN UNUSED IMAGES
            # ====================================================
            echo ""
            echo "Cleaning unused Docker images..."
            docker image prune -f

            # ====================================================
            # FINAL MESSAGE
            # ====================================================
            echo ""
            echo "=============================================="
            echo " Deployment completed successfully"
            echo "=============================================="
            echo ""
            echo "Docker image tag deployed:"
            echo "latest"
            echo ""
            echo "Gateway:"
            echo "http://SERVER_IP:8095"
            echo ""
            echo "Game Arena staging deployment finished."
