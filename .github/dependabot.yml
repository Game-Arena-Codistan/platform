version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/api
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      api-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /apps/web
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      web-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /tests/e2e
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /apps/api
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /apps/web
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /apps/admin
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /apps/game-origin
    schedule: {interval: weekly}
