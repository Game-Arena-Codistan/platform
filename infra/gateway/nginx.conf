events { worker_connections 1024; }
http {
  server_tokens off;
  # Compose DNS. Re-resolve so recreate of admin/web/api does not leave stale upstream IPs.
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location = /callback {
      set $api_upstream api:8081;
      proxy_pass http://$api_upstream/v1/jazzcash/wallet/callback;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header Server;
    }
    location /api/ {
      set $api_upstream api:8081;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header Server;
    }
    location = /games/healthz {
      set $games_upstream game-origin:8080;
      proxy_pass http://$games_upstream/healthz;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header Server;
    }
    location /games/ {
      set $games_upstream game-origin:8080;
      proxy_pass http://$games_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header Server;
    }
    # Public operations console. Console data still requires API admin auth.
    location = /admin { return 301 /admin/; }
    location /admin/ {
      set $admin_upstream admin:8080;
      rewrite ^/admin/(.*)$ /$1 break;
      proxy_pass http://$admin_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header Server;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Cache-Control "no-store" always;
    }
    location / {
      set $web_upstream web:8080;
      proxy_pass http://$web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
