events { worker_connections 1024; }
http {
  server_tokens off;
  # Re-resolve admin so gateway can start before/after admin recreate without stale IPs.
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream web { server web:8080; }
  upstream api { server api:8081; }
  upstream games { server game-origin:8080; }
  server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location = /callback {
      proxy_pass http://api/v1/jazzcash/wallet/callback;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header Server;
    }
    location /api/ {
      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header Server;
    }
    location = /games/healthz {
      proxy_pass http://games/healthz;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header Server;
    }
    location /games/ {
      proxy_pass http://games;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header Server;
    }
    # Public operations console. Requires API admin auth after the shell loads.
    location = /admin { return 301 /admin/; }
    location /admin/ {
      set $admin_upstream admin:8080;
      rewrite ^/admin/(.*)$ /$1 break;
      proxy_pass http://$admin_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_hide_header Server;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header Cache-Control "no-store" always;
    }
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
    }
  }
}
