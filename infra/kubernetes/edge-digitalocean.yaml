apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: game-arena
  namespace: game-arena
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: game-arena-REPLACE_ENVIRONMENT
spec:
  gatewayClassName: cilium
  listeners:
    - name: player-https
      hostname: "REPLACE_PUBLIC_HOST"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs: [{name: REPLACE_TLS_SECRET_NAME, kind: Secret}]
      allowedRoutes: {namespaces: {from: Same}}
    - name: games-https
      hostname: "REPLACE_GAME_HOST"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs: [{name: REPLACE_TLS_SECRET_NAME, kind: Secret}]
      allowedRoutes: {namespaces: {from: Same}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: player, namespace: game-arena}
spec:
  parentRefs: [{name: game-arena, sectionName: player-https}]
  hostnames: ["REPLACE_PUBLIC_HOST"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
      backendRefs: [{name: api, port: 8081}]
    - backendRefs: [{name: web, port: 8080}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: games, namespace: game-arena}
spec:
  parentRefs: [{name: game-arena, sectionName: games-https}]
  hostnames: ["REPLACE_GAME_HOST"]
  rules:
    - backendRefs: [{name: game-origin, port: 8080}]
