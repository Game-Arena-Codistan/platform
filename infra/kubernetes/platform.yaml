apiVersion: v1
kind: Namespace
metadata:
  name: game-arena
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: game-arena-config
  namespace: game-arena
data:
  NODE_ENV: production
  PORT: "8081"
  PUBLIC_ORIGIN: "REPLACE_PUBLIC_ORIGIN"
  ALLOWED_ORIGINS: "REPLACE_ALLOWED_ORIGINS"
  DATABASE_SSL: "REPLACE_DATABASE_SSL"
  REQUIRE_DATABASE: "true"
  OTP_PROVIDER_MODE: "REPLACE_OTP_PROVIDER_MODE"
  ALLOW_DEBUG_OTP: "REPLACE_ALLOW_DEBUG_OTP"
  JAZZCASH_MODE: "REPLACE_JAZZCASH_MODE"
  GAME_ARENA_MODE: live
  GAME_ARENA_API_BASE_URL: /api
  GAME_ARENA_GAME_ORIGIN: "REPLACE_GAME_ORIGIN"
  GAME_ARENA_GAME_HOSTS: "REPLACE_GAME_HOSTS"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: game-arena
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: game-arena-api}
  template:
    metadata:
      labels: {app: game-arena-api}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-pull}]
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/game-arena-codistan/platform-api:REPLACE_IMAGE_TAG
          ports: [{containerPort: 8081}]
          envFrom:
            - configMapRef: {name: game-arena-config}
            - secretRef: {name: game-arena-secrets}
          readinessProbe: {httpGet: {path: /readyz, port: 8081}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8081}, initialDelaySeconds: 10, periodSeconds: 20}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: game-arena}
spec:
  selector: {app: game-arena-api}
  ports: [{port: 8081, targetPort: 8081}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: game-arena}
spec:
  replicas: 2
  selector: {matchLabels: {app: game-arena-web}}
  template:
    metadata: {labels: {app: game-arena-web}}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-pull}]
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: ghcr.io/game-arena-codistan/platform-web:REPLACE_IMAGE_TAG
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: game-arena-config}}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 20}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: game-arena}
spec:
  selector: {app: game-arena-web}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: game-origin, namespace: game-arena}
spec:
  replicas: 2
  selector: {matchLabels: {app: game-arena-game-origin}}
  template:
    metadata: {labels: {app: game-arena-game-origin}}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-pull}]
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: game-origin
          image: ghcr.io/game-arena-codistan/platform-games:REPLACE_IMAGE_TAG
          ports: [{containerPort: 8080}]
          env:
            - {name: GAME_ARENA_FRAME_ANCESTORS, value: "REPLACE_PUBLIC_ORIGIN"}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 20}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: game-origin, namespace: game-arena}
spec:
  selector: {app: game-arena-game-origin}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: game-arena}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-public-services, namespace: game-arena}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [game-arena-api, game-arena-web, game-arena-game-origin]
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8081}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-admin-internal, namespace: game-arena}
spec:
  podSelector: {matchLabels: {app: game-arena-admin}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-platform-egress, namespace: game-arena}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {}}]
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 5432}
