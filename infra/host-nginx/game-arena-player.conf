# Included by the public staging host nginx server block for gsmarena-play.codistan.org.
# Sends the player PWA and remaining routes to the Compose gateway (8095).
# More-specific locations such as /admin/ win over this prefix match.
location / {
  proxy_pass http://127.0.0.1:8095;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Request-ID $request_id;
}
