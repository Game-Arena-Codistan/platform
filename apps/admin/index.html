<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'">
  <link rel="stylesheet" href="./styles.css">
  <title>Game Arena Operations</title>
</head>
<body>
<header><div><b>Game Arena</b><span>Operations &amp; Reporting</span></div><div><button id="refresh" type="button">Refresh</button><button id="admin-logout" type="button" hidden>Sign out</button></div></header>
<main>
  <section id="auth" class="panel">
    <h1>Operations access</h1>
    <p>Authorized administrators only. Sign in using the credentials provided by your organization.</p>
    <form id="password-auth" hidden><label>Email<input name="email" type="email" autocomplete="username" required maxlength="128"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button type="submit">Sign in</button></form>
    <p id="admin-login-unavailable" hidden>Use the authorized identity proxy. Password sign-in is not configured.</p>
    <form id="local-auth" hidden><label>Administrator key<input name="key" type="password" autocomplete="current-password"></label><button type="submit">Sign in</button></form>
    <p id="auth-status" class="error"></p>
  </section>
  <section id="console" hidden>
    <nav aria-label="Operations sections">
      <button data-view="overview">Overview</button>
      <button data-view="reports" data-capability="reports.read">Reports</button>
      <button data-view="campaign" data-capability="reports.read">Campaign</button>
      <button data-view="campaignSetup" data-capability="reports.read">Campaign setup</button>
      <button data-view="campaignDaily" data-capability="reports.read">Daily logs</button>
      
      <button data-view="plans" data-capability="subscription.read">Plans</button>
      <button data-view="payments" data-capability="reports.read">Payments</button>
      <button data-view="subscriptions" data-capability="subscription.read">Paid passes</button>
      <button data-view="recurring" data-capability="reports.read">Recurring customers</button>
      <button data-view="reconciliation" data-capability="reports.read">Reconciliation</button>
      <button data-view="benefits" data-capability="reports.read">Benefit costs</button>
      <button data-view="exports" data-capability="reports.export">Exports</button>
      <button data-view="users">Users</button>
      <button data-view="games">Games</button>
      <button data-view="reviews">Reviews</button>
      <button data-view="audit">Audit</button>
    </nav>
    <section id="view" class="panel" aria-live="polite"></section>
  </section>
</main>
<div id="toast" role="status"></div>
<script src="./config.js"></script><script type="module" src="./app.js"></script>
</body>
</html>
