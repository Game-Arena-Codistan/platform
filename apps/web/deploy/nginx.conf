server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header X-Frame-Options DENY always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location = /index.html { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
  location = /config.js { add_header Cache-Control "no-store" always; try_files $uri =404; }
  location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate" always; try_files $uri =404; }
  location ~* \.(?:css|js|svg|webmanifest)$ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
