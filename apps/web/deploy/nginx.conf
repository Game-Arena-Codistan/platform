server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://games.codistan.org; connect-src 'self'; frame-src 'self' https://games.codistan.org; object-src 'none'; base-uri 'self'; form-action 'self' https://payments.jazzcash.com.pk https://sandbox.jazzcash.com.pk; frame-ancestors 'none'; upgrade-insecure-requests" always;
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /config.js { add_header Cache-Control "no-store"; try_files $uri =404; }
  location ~* \.(?:css|js|svg|webmanifest)$ { add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
