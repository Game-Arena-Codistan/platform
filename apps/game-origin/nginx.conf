server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cross-Origin-Resource-Policy cross-origin always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "frame-ancestors https://gamearena.pk https://*.gamearena.pk; object-src 'none'; base-uri 'self'" always;

  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location ~ /\. { deny all; }
  location /games/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri $uri/ =404;
  }
  location / { return 404; }
}
