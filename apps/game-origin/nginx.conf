map $uri $game_disabled {
  default 0;
  include /etc/nginx/conf.d/disabled-games.map;
}
server {
  listen ${PORT};
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  etag on;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Cross-Origin-Resource-Policy cross-origin always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), clipboard-read=(), clipboard-write=(), display-capture=()" always;
  add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors ${GAME_ARENA_FRAME_ANCESTORS}" always;

  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location ~ /(?:^|/)\. { deny all; }
  location ~* \.(?:php|cgi|pl|py|rb|sh|exe|dll|so|dylib|jar|war|class|bat|cmd|ps1)$ { return 404; }
  location /games/ {
    if ($game_disabled) { return 410; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri $uri/ =404;
  }
  location / { return 404; }
}
